name: Elastic inline CPU protocol checks
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'areal/elastic/**'
      - 'areal/trainer/rl_trainer.py'
      - 'areal/infra/workflow_executor.py'
      - 'areal/infra/utils/proc.py'
      - 'areal/v2/**'
      - 'examples/elastic/**'
      - 'tests/test_elastic*.py'
      - 'tests/elastic_tools/**'
      - '.github/workflows/elastic-cpu.yml'
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU test environment
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r examples/elastic/requirements-cpu.txt
          python -m pip install --no-deps awex==0.8.1
      - name: Check native queue, lifecycle, state and event-driven tools
        env:
          CUDA_VISIBLE_DEVICES: ''
        run: |
          python -m pytest -q tests/test_elastic_runtime.py tests/test_elastic_checkpoint.py \
            tests/test_elastic_runtime_state.py tests/test_elastic_demo.py tests/test_elastic_swe.py \
            tests/test_elastic_inline.py tests/test_elastic_progress.py \
            tests/test_elastic_reproduce.py tests/test_staleness_manager.py
          python -m pytest -q tests/v2/weight_update/test_wu_controller.py \
            -k 'full_lifecycle or successful_connect_and_disconnect or sglang_teardown_ack_waits or disconnect_waits_for_running_update'
