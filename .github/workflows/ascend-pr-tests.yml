name: Ascend PR Tests

on:
  pull_request:
    branches:
      - ascend
  push:
    branches:
      - ascend
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ascend-pr-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.18"
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.11

      - name: Install development environment
        run: uv sync --frozen --group dev

      - name: Run pre-commit
        run: uv run pre-commit run --all-files

  cpu-unit-tests:
    name: cpu-unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      AREAL_IS_IN_CI: "1"
      HF_HOME: "${{ github.workspace }}/.cache/huggingface"
      HF_HUB_DISABLE_XET: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
      NO_PROXY: "127.0.0.1,localhost"
      UV_HTTP_RETRIES: "5"
      UV_HTTP_TIMEOUT: "300"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.18"
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock
          save-cache: false

      - name: Set up Python
        run: uv python install 3.11

      - name: Install CPU test environment
        run: uv sync --frozen --group dev

      - name: Verify CPU-only environment
        run: |
          uv run python - <<'PY'
          import torch

          print("torch:", torch.__version__)
          print("CUDA available:", torch.cuda.is_available())
          assert not torch.cuda.is_available()
          PY

      - name: Pre-download slow-test artifacts
        env:
          HF_HUB_OFFLINE: "0"
          TRANSFORMERS_OFFLINE: "0"
          HF_DATASETS_OFFLINE: "0"
        run: |
          set -euo pipefail

          uv run hf --version

          download_with_retry() {
            local attempt
            local delay

            for attempt in 1 2 3 4 5; do
              if "$@"; then
                return 0
              fi

              if [[ "${attempt}" -lt 5 ]]; then
                delay=$((attempt * 30))
                echo "Download attempt ${attempt} failed; retrying in ${delay}s"
                sleep "${delay}"
              fi
            done

            echo "Download failed after 5 attempts"
            return 1
          }

          download_with_retry \
            uv run hf download \
            openai/gsm8k \
            --repo-type dataset \
            --max-workers 4

          download_with_retry \
            uv run hf download \
            hiyouga/geometry3k \
            --repo-type dataset \
            --max-workers 4

          download_with_retry \
            uv run hf download \
            Qwen/Qwen3-0.6B \
            --exclude "*.safetensors" \
            --max-workers 4

          download_with_retry \
            uv run hf download \
            Qwen/Qwen2.5-VL-3B-Instruct \
            --exclude "*.safetensors" \
            --max-workers 4

      - name: Run CPU unit tests
        run: |
          uv run pytest -q \
            tests/test_adv_norm_config.py \
            tests/test_allocation_mode.py \
            tests/test_async_reward_wrapper.py \
            tests/test_async_task_runner.py \
            tests/test_attn_impl_validation.py \
            tests/test_awex_runtime.py \
            tests/test_clevr_reward.py \
            tests/test_code_agent.py \
            tests/test_dataset_mixture.py \
            tests/test_domain_router_workflow.py \
            tests/test_dpo.py \
            tests/test_dynamic_import.py \
            tests/test_eval_dispatch.py \
            tests/test_functional.py \
            tests/test_geometry3k_sft_dataset.py \
            tests/test_math_verify_reward.py \
            tests/test_mopd_loss.py \
            tests/test_perf_trace_converter.py \
            tests/test_ppo_stats.py \
            tests/test_prox_approx.py \
            tests/test_ray_scheduler.py \
            tests/test_rejection_sampling.py \
            tests/test_requires_padded_seq.py \
            tests/test_seqpack.py \
            tests/test_split_trajectory_for_dump.py \
            tests/test_staleness_manager.py \
            tests/test_teacher_domain_routing.py \
            tests/test_utils.py \
            tests/test_vllm_generation_request.py \
            tests/test_vllm_pp_mismatch.py \
            tests/test_workflow_detection.py

      - name: Run qualified slow CPU tests
        run: |
          uv run pytest -q -m slow \
            tests/infra/data_service/test_epoch_crossing.py \
            tests/infra/data_service/test_data_service_e2e.py

      - name: Run additional CPU-compatible tests
        run: |
          uv run pytest -q \
            -m "not skip and not skipif" \
            -k "not torchrun_multi_rank" \
            tests/test_perf_tracer.py \
            tests/test_megatron_async_save.py \
            tests/test_megatron_engine_vlm.py::TestVisionModelDetection \
            tests/test_mindspeed_gdn_patch.py \
            tests/test_reassemble_cp_logprobs.py \
            tests/test_vision_sp_shard.py \
            tests/test_warmup_process_groups.py

  npu-pr-tests:
    name: npu-pr-tests
    runs-on: linux-aarch64-a3-16
    timeout-minutes: 90
    container:
      image: ghcr.io/hwvanici/areal_npu:v1.0.6rc1-a3

    env:
      AREAL_IS_IN_CI: "1"
      AREAL_TEST_QWEN3_PATH: "/root/.cache/modelscope/hub/models/Qwen/Qwen3-0.6B"
      AREAL_TEST_QWEN3_MOE_PATH: "/root/.cache/modelscope/hub/models/Qwen/Qwen3-30B-A3B"
      AREAL_TEST_QWEN35_PATH: "/root/.cache/modelscope/hub/models/Qwen/Qwen3.5-0.8B"
      AREAL_TEST_QWEN35_MOE_PATH: "/root/.cache/modelscope/hub/models/Qwen/Qwen3.5-35B-A3B"
      HF_ENDPOINT: "https://hf-mirror.com"
      HF_HUB_DISABLE_XET: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          clean: true

      - name: Install current AReaL repository
        run: pip install -e . --no-deps

      - name: Verify NPU runtime
        run: |
          set -euo pipefail

          python - <<'PY'
          import torch
          import torch_npu

          print("torch:", torch.__version__)
          print("torch_npu:", torch_npu.__version__)
          print("NPU available:", torch.npu.is_available())
          print("NPU count:", torch.npu.device_count())

          assert torch.npu.is_available()
          assert torch.npu.device_count() >= 16
          PY

          npu-smi info

      - name: Run NPU-image dependency tests
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: |
          pytest -q \
            --deselect tests/test_megatron_engine_vlm.py::TestVisionModelDetection \
            tests/test_megatron_engine_vlm.py
          pytest -q \
            tests/test_model_packed_seq_cp.py
          pytest -q -m skipif tests/test_reassemble_cp_logprobs.py

      - name: Verify cached NPU test models
        run: |
          set -euo pipefail

          verify_model() {
            local model_path="$1"
            local weight_file

            test -f "${model_path}/config.json"
            weight_file=$(find -L "${model_path}" -maxdepth 1 -type f \
              \( -name '*.safetensors' -o -name '*.bin' \) -print -quit)
            test -n "${weight_file}"
            echo "Using cached model: ${model_path}"
          }

          verify_model "${AREAL_TEST_QWEN3_PATH}"
          verify_model "${AREAL_TEST_QWEN3_MOE_PATH}"
          verify_model "${AREAL_TEST_QWEN35_PATH}"
          verify_model "${AREAL_TEST_QWEN35_MOE_PATH}"

      - name: Run NPU test suites
        env:
          HF_HUB_OFFLINE: "1"
          PYTHONWARNINGS: "ignore"
          TRANSFORMERS_OFFLINE: "1"
        run: |
          set -euo pipefail

          mkdir -p npu-test-logs
          mkdir -p /root/.cache/areal-ci-tmp

          dcp_tmpdir=$(mktemp -d \
            "/root/.cache/areal-ci-tmp/dcp-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-XXXXXX")
          hf_tmpdir=$(mktemp -d \
            "/root/.cache/areal-ci-tmp/hf-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-XXXXXX")
          dcp_followup_tmpdir=$(mktemp -d \
            "/tmp/areal-ci-dcp-followup-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-XXXXXX")
          compute_tmpdir=$(mktemp -d \
            "/tmp/areal-ci-compute-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-XXXXXX")
          checkpoint_pid=""
          compute_pid=""

          cleanup() {
            local pid

            for pid in "${checkpoint_pid}" "${compute_pid}"; do
              if [[ -n "${pid}" ]]; then
                kill "${pid}" 2>/dev/null || true
              fi
            done
            rm -rf -- \
              "${dcp_tmpdir}" \
              "${hf_tmpdir}" \
              "${dcp_followup_tmpdir}" \
              "${compute_tmpdir}"
          }
          trap cleanup EXIT

          finish_log() {
            local name="$1"
            local status="$2"
            local log_path="npu-test-logs/${name}.log"

            if [[ "${status}" -eq 0 ]]; then
              tail -n 40 "${log_path}" >"${log_path}.compact"
              mv "${log_path}.compact" "${log_path}"
              cat "${log_path}"
            else
              echo "Last 240 lines from ${log_path}:"
              tail -n 240 "${log_path}"
            fi
          }

          run_test() {
            local name="$1"
            local devices="$2"
            local selector="$3"
            local test_tmpdir="$4"
            local timeout_seconds="$5"
            local active_pid
            local completed_pid
            local completed_status
            local started_at
            local status
            local timer_pid

            started_at=${SECONDS}
            echo "START: ${name} devices=${devices} TMPDIR=${test_tmpdir}"

            (
              export ASCEND_RT_VISIBLE_DEVICES="${devices}"
              export TMPDIR="${test_tmpdir}"
              timeout --kill-after=60s "${timeout_seconds}s" pytest -q "${selector}"
            ) >"npu-test-logs/${name}.log" 2>&1 &
            active_pid=$!

            while true; do
              sleep 60 &
              timer_pid=$!

              set +e
              wait -n -p completed_pid "${active_pid}" "${timer_pid}"
              completed_status=$?
              set -e

              if [[ "${completed_pid}" == "${active_pid}" ]]; then
                status=${completed_status}
                kill "${timer_pid}" 2>/dev/null || true
                wait "${timer_pid}" 2>/dev/null || true
                break
              fi

              echo "PROGRESS: ${name} elapsed=$((SECONDS - started_at))s"
              du -sh "${test_tmpdir}" 2>/dev/null || true
            done

            if [[ "${status}" -eq 0 ]]; then
              echo "PASS: ${name} elapsed=$((SECONDS - started_at))s"
            else
              echo "FAIL: ${name} status=${status} elapsed=$((SECONDS - started_at))s"
            fi
            finish_log "${name}" "${status}"
            return "${status}"
          }

          start_normal_test() {
            local name="$1"
            local devices="$2"
            local selector="$3"

            echo "START: ${name} devices=${devices}"
            (
              export ASCEND_RT_VISIBLE_DEVICES="${devices}"
              export TMPDIR="${lane_tmpdir}"
              timeout --kill-after=60s 900s pytest -q "${selector}"
            ) >"npu-test-logs/${name}.log" 2>&1 &
            pids+=("$!")
            names+=("${name}")
          }

          wait_for_normal_wave() {
            local index
            local status

            for index in "${!pids[@]}"; do
              if wait "${pids[$index]}"; then
                status=0
                echo "PASS: ${names[$index]}"
              else
                status=$?
                echo "FAIL: ${names[$index]} status=${status}"
                failed=1
              fi
              finish_log "${names[$index]}" "${status}"
            done

            pids=()
            names=()
          }

          checkpoint_lane() {
            local failed=0
            local lane_tmpdir="${dcp_followup_tmpdir}"
            local -a names=()
            local -a pids=()

            run_test \
              qwen3-30b-dcp-save-load \
              8,9,10,11,12,13,14,15 \
              tests/test_megatron_engine_distributed.py::test_qwen3moe_dcp_save_load \
              "${dcp_tmpdir}" \
              1200 \
              || failed=1
            rm -rf -- "${dcp_tmpdir}"

            start_normal_test \
              qwen35-hf-save-load \
              8,9 \
              tests/test_megatron_engine_distributed.py::test_qwen3_5_hf_save_load
            start_normal_test \
              qwen35-tp2 \
              10,11 \
              tests/test_megatron_engine_distributed.py::test_qwen3_5_tensor_parallel
            start_normal_test \
              qwen35-pp2 \
              12,13 \
              tests/test_megatron_engine_distributed.py::test_qwen3_5_pipeline_parallel
            start_normal_test \
              qwen35-single-forward \
              14 \
              tests/test_megatron_engine_distributed.py::test_qwen3_5_single_gpu_forward
            start_normal_test \
              distributed-lock \
              15 \
              'tests/test_lock.py::test_distributed_lock_single_rank[1]'
            wait_for_normal_wave

            return "${failed}"
          }

          compute_lane() {
            local failed=0
            local lane_tmpdir="${compute_tmpdir}"
            local -a names=()
            local -a pids=()

            run_test \
              qwen35-35b-hf-save-load \
              0,1,2,3,4,5,6,7 \
              tests/test_megatron_engine_distributed.py::test_qwen3_5_moe_hf_save_load \
              "${hf_tmpdir}" \
              1800 \
              || failed=1
            rm -rf -- "${hf_tmpdir}"

            run_test \
              qwen35-35b-expert-parallel \
              0,1,2,3,4,5,6,7 \
              tests/test_megatron_engine_distributed.py::test_qwen3_5_moe_expert_parallel \
              "${compute_tmpdir}" \
              1200 \
              || failed=1
            run_test \
              qwen3-30b-expert-parallel \
              0,1,2,3,4,5,6,7 \
              tests/test_megatron_engine_distributed.py::test_qwen3moe_expert_parallel \
              "${compute_tmpdir}" \
              1200 \
              || failed=1

            start_normal_test \
              qwen3-grad-norm \
              0,1 \
              tests/test_megatron_engine_distributed.py::test_qwen3_grad_norm_mb_invariance
            start_normal_test \
              qwen3-tp2 \
              2,3 \
              tests/test_megatron_engine_distributed.py::test_qwen3_tensor_parallel
            start_normal_test \
              qwen3-pp2 \
              4,5 \
              tests/test_megatron_engine_distributed.py::test_qwen3_pipeline_parallel
            start_normal_test \
              qwen3-vpp2 \
              6,7 \
              tests/test_megatron_engine_distributed.py::test_qwen3_virtual_pipeline_parallel
            wait_for_normal_wave

            start_normal_test \
              qwen3-cp2 \
              0,1 \
              tests/test_megatron_engine_distributed.py::test_qwen3_context_parallel
            start_normal_test \
              ulysses \
              2,3 \
              'tests/test_ulysses.py::test_ulysses[2]'
            start_normal_test \
              vocab-parallel \
              4,5 \
              'tests/test_vocab_parallel.py::test_vocab_parallel[2]'
            start_normal_test \
              perf-tracer \
              6,7 \
              tests/test_perf_tracer.py::test_perf_tracer_torchrun_multi_rank
            wait_for_normal_wave

            start_normal_test \
              distributed-lock2 \
              0,1 \
              'tests/test_lock.py::test_distributed_lock_multi_rank[2]'
            start_normal_test \
              vocab-parallel4 \
              2,3,4,5 \
              'tests/test_vocab_parallel.py::test_vocab_parallel[4]'
            wait_for_normal_wave

            return "${failed}"
          }

          checkpoint_lane &
          checkpoint_pid=$!
          compute_lane &
          compute_pid=$!

          failed=0
          if wait "${checkpoint_pid}"; then
            echo "PASS: checkpoint lane"
          else
            echo "FAIL: checkpoint lane"
            failed=1
          fi
          checkpoint_pid=""

          if wait "${compute_pid}"; then
            echo "PASS: compute lane"
          else
            echo "FAIL: compute lane"
            failed=1
          fi
          compute_pid=""

          exit "${failed}"

      - name: Upload NPU test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: npu-pr-test-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: npu-test-logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Collect final NPU diagnostics
        if: always()
        run: npu-smi info || true
