name: Ascend PR Tests

on:
  pull_request:
    branches:
      - ascend
  push:
    branches:
      - ascend
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ascend-pr-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.18"
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.11

      - name: Install development environment
        run: uv sync --frozen --group dev

      - name: Run pre-commit
        run: uv run pre-commit run --all-files

  cpu-unit-tests:
    name: cpu-unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      AREAL_IS_IN_CI: "1"
      HF_HOME: "${{ github.workspace }}/.cache/huggingface"
      HF_HUB_DISABLE_XET: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
      NO_PROXY: "127.0.0.1,localhost"
      UV_HTTP_RETRIES: "5"
      UV_HTTP_TIMEOUT: "300"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.18"
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock
          save-cache: false

      - name: Set up Python
        run: uv python install 3.11

      - name: Install CPU test environment
        run: uv sync --frozen --group dev

      - name: Verify CPU-only environment
        run: |
          uv run python - <<'PY'
          import torch

          print("torch:", torch.__version__)
          print("CUDA available:", torch.cuda.is_available())
          assert not torch.cuda.is_available()
          PY

      - name: Pre-download slow-test artifacts
        env:
          HF_HUB_OFFLINE: "0"
          TRANSFORMERS_OFFLINE: "0"
          HF_DATASETS_OFFLINE: "0"
        run: |
          set -euo pipefail

          uv run hf --version

          download_with_retry() {
            local attempt
            local delay

            for attempt in 1 2 3 4 5; do
              if "$@"; then
                return 0
              fi

              if [[ "${attempt}" -lt 5 ]]; then
                delay=$((attempt * 30))
                echo "Download attempt ${attempt} failed; retrying in ${delay}s"
                sleep "${delay}"
              fi
            done

            echo "Download failed after 5 attempts"
            return 1
          }

          download_with_retry \
            uv run hf download \
            openai/gsm8k \
            --repo-type dataset \
            --max-workers 4

          download_with_retry \
            uv run hf download \
            hiyouga/geometry3k \
            --repo-type dataset \
            --max-workers 4

          download_with_retry \
            uv run hf download \
            Qwen/Qwen3-0.6B \
            --exclude "*.safetensors" \
            --max-workers 4

          download_with_retry \
            uv run hf download \
            Qwen/Qwen2.5-VL-3B-Instruct \
            --exclude "*.safetensors" \
            --max-workers 4

      - name: Collect base CPU tests
        if: github.event_name != 'workflow_dispatch'
        env:
          AREAL_TEST_REPORT_DIR: /tmp/base-cpu-test-reports
          CPU_TEST_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail

          if [[ -z "${CPU_TEST_BASE_SHA}" || "${CPU_TEST_BASE_SHA}" =~ ^0+$ ]]; then
            echo "No base commit is available; skipping the comparison"
            exit 0
          fi

          base_dir="$(mktemp -d)"
          plugin_dir="$(mktemp -d)"
          cleanup() {
            rm -rf -- "${base_dir}" "${plugin_dir}"
          }
          trap cleanup EXIT

          cp scripts/ci_test_report.py "${plugin_dir}/ci_test_report.py"
          git archive "${CPU_TEST_BASE_SHA}" | tar -x -C "${base_dir}"

          if ! (
            cd "${base_dir}"
            "${GITHUB_WORKSPACE}/.venv/bin/python" scripts/select_cpu_tests.py \
              --ignore tests/experimental/archon \
              > /tmp/base-cpu-test-files.txt
            mapfile -t base_cpu_test_files < /tmp/base-cpu-test-files.txt
            test "${#base_cpu_test_files[@]}" -gt 0
            PYTHONPATH="${plugin_dir}:${base_dir}" \
              "${GITHUB_WORKSPACE}/.venv/bin/python" -m pytest -q \
              --collect-only \
              -p ci_test_report \
              -m "not npu and not multi_npu and not cuda and not nccl and not sglang and not vllm and not integration" \
              "${base_cpu_test_files[@]}"
          ) > /tmp/base-cpu-collection.log 2>&1; then
            cat /tmp/base-cpu-collection.log
            exit 1
          fi

      - name: Run CPU unit tests
        env:
          AREAL_TEST_REPORT_DIR: /tmp/current-cpu-test-reports
        run: |
          set -euo pipefail

          uv run python scripts/select_cpu_tests.py \
            --ignore tests/experimental/archon \
            > /tmp/cpu-test-files.txt
          mapfile -t cpu_test_files < /tmp/cpu-test-files.txt
          test "${#cpu_test_files[@]}" -gt 0
          printf 'Selected %s CPU test modules\n' "${#cpu_test_files[@]}"
          uv run pytest -q \
            -p scripts.ci_test_report \
            -m "not npu and not multi_npu and not cuda and not nccl and not sglang and not vllm and not integration" \
            "${cpu_test_files[@]}"

      - name: Report CPU test counts
        if: always()
        env:
          CPU_TEST_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail

          if [[ ! -d /tmp/current-cpu-test-reports ]]; then
            echo "CPU test report was not produced"
            exit 0
          fi

          report_args=(
            --current /tmp/current-cpu-test-reports
            --suite CPU
            --step-summary "${GITHUB_STEP_SUMMARY}"
          )
          if [[ -d /tmp/base-cpu-test-reports ]]; then
            git diff --name-only "${CPU_TEST_BASE_SHA}" HEAD -- tests \
              > /tmp/changed-cpu-test-files.txt
            report_args+=(
              --base /tmp/base-cpu-test-reports
              --base-sha "${CPU_TEST_BASE_SHA}"
              --changed-test-files /tmp/changed-cpu-test-files.txt
            )
          fi
          uv run python scripts/ci_test_report.py summarize "${report_args[@]}"

  npu-pr-tests:
    name: npu-pr-tests
    runs-on: linux-aarch64-a3-16
    timeout-minutes: 90
    container:
      image: ghcr.io/hwvanici/areal_npu:v1.0.6rc1-a3

    env:
      AREAL_IS_IN_CI: "1"
      AREAL_TEST_QWEN3_PATH: "/root/.cache/modelscope/hub/models/Qwen/Qwen3-0.6B"
      AREAL_TEST_QWEN3_MOE_PATH: "/root/.cache/modelscope/hub/models/Qwen/Qwen3-30B-A3B"
      AREAL_TEST_QWEN35_PATH: "/root/.cache/modelscope/hub/models/Qwen/Qwen3.5-0.8B"
      AREAL_TEST_QWEN35_MOE_PATH: "/root/.cache/modelscope/hub/models/Qwen/Qwen3.5-35B-A3B"
      HF_ENDPOINT: "https://hf-mirror.com"
      HF_HUB_DISABLE_XET: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          clean: true

      - name: Install current AReaL repository
        run: pip install -e . --no-deps

      - name: Collect base NPU test inventory
        if: github.event_name != 'workflow_dispatch'
        env:
          AREAL_TEST_REPORT_DIR: /tmp/base-npu-test-reports
          NPU_TEST_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail

          if [[ -z "${NPU_TEST_BASE_SHA}" || "${NPU_TEST_BASE_SHA}" =~ ^0+$ ]]; then
            echo "No base commit is available; skipping the comparison"
            exit 0
          fi

          base_dir="$(mktemp -d)"
          plugin_dir="$(mktemp -d)"
          cleanup() {
            rm -rf -- "${base_dir}" "${plugin_dir}"
          }
          trap cleanup EXIT

          cp scripts/ci_test_report.py "${plugin_dir}/ci_test_report.py"
          git -c safe.directory="${GITHUB_WORKSPACE}" \
            archive "${NPU_TEST_BASE_SHA}" | tar -x -C "${base_dir}"
          : > /tmp/unavailable-base-npu-test-files.txt

          collect_base_tests() {
            local name="$1"
            local status
            local test_file="${!#}"
            shift

            if [[ ! -f "${base_dir}/${test_file}" ]]; then
              echo "Base test file does not exist: ${test_file}"
              return 0
            fi

            set +e
            (
              cd "${base_dir}"
              PYTHONPATH="${plugin_dir}:${base_dir}" \
                python -m pytest -q \
                --collect-only \
                -p ci_test_report \
                "$@"
            ) > "/tmp/base-npu-${name}.log" 2>&1
            status=$?
            set -e

            if [[ "${status}" -ne 0 ]]; then
              printf '%s\n' "${test_file}" \
                >> /tmp/unavailable-base-npu-test-files.txt
              echo "::warning title=Base NPU inventory unavailable::${test_file} exited with status ${status}"
              tail -n 40 "/tmp/base-npu-${name}.log"
            fi
          }

          collect_base_tests megatron-vlm \
            --deselect tests/test_megatron_engine_vlm.py::TestVisionModelDetection \
            tests/test_megatron_engine_vlm.py
          collect_base_tests model-packed-seq-cp \
            tests/test_model_packed_seq_cp.py
          collect_base_tests reassemble-cp-logprobs \
            -m skipif tests/test_reassemble_cp_logprobs.py
          collect_base_tests megatron-distributed \
            tests/test_megatron_engine_distributed.py
          collect_base_tests lock tests/test_lock.py
          collect_base_tests perf-tracer tests/test_perf_tracer.py
          collect_base_tests ulysses tests/test_ulysses.py
          collect_base_tests vocab-parallel tests/test_vocab_parallel.py

      - name: Verify NPU runtime
        run: |
          set -euo pipefail

          python - <<'PY'
          import torch
          import torch_npu

          print("torch:", torch.__version__)
          print("torch_npu:", torch_npu.__version__)
          print("NPU available:", torch.npu.is_available())
          print("NPU count:", torch.npu.device_count())

          assert torch.npu.is_available()
          assert torch.npu.device_count() >= 16
          PY

          npu-smi info

      - name: Run NPU-image dependency tests
        env:
          AREAL_TEST_REPORT_DIR: /tmp/current-npu-test-reports
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: |
          pytest -q -p scripts.ci_test_report \
            --deselect tests/test_megatron_engine_vlm.py::TestVisionModelDetection \
            tests/test_megatron_engine_vlm.py
          pytest -q -p scripts.ci_test_report \
            tests/test_model_packed_seq_cp.py
          pytest -q -p scripts.ci_test_report \
            -m skipif tests/test_reassemble_cp_logprobs.py

      - name: Verify cached NPU test models
        run: |
          set -euo pipefail

          verify_model() {
            local model_path="$1"
            local weight_file

            test -f "${model_path}/config.json"
            weight_file=$(find -L "${model_path}" -maxdepth 1 -type f \
              \( -name '*.safetensors' -o -name '*.bin' \) -print -quit)
            test -n "${weight_file}"
            echo "Using cached model: ${model_path}"
          }

          verify_model "${AREAL_TEST_QWEN3_PATH}"
          verify_model "${AREAL_TEST_QWEN3_MOE_PATH}"
          verify_model "${AREAL_TEST_QWEN35_PATH}"
          verify_model "${AREAL_TEST_QWEN35_MOE_PATH}"

      - name: Run NPU test suites
        env:
          AREAL_TEST_REPORT_DIR: /tmp/current-npu-test-reports
          HF_HUB_OFFLINE: "1"
          PYTHONWARNINGS: "ignore"
          TRANSFORMERS_OFFLINE: "1"
        run: |
          set -euo pipefail

          mkdir -p npu-test-logs
          mkdir -p /root/.cache/areal-ci-tmp

          dcp_tmpdir=$(mktemp -d \
            "/root/.cache/areal-ci-tmp/dcp-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-XXXXXX")
          hf_tmpdir=$(mktemp -d \
            "/root/.cache/areal-ci-tmp/hf-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-XXXXXX")
          dcp_followup_tmpdir=$(mktemp -d \
            "/tmp/areal-ci-dcp-followup-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-XXXXXX")
          compute_tmpdir=$(mktemp -d \
            "/tmp/areal-ci-compute-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-XXXXXX")
          checkpoint_pid=""
          compute_pid=""

          cleanup() {
            local pid

            for pid in "${checkpoint_pid}" "${compute_pid}"; do
              if [[ -n "${pid}" ]]; then
                kill "${pid}" 2>/dev/null || true
              fi
            done
            rm -rf -- \
              "${dcp_tmpdir}" \
              "${hf_tmpdir}" \
              "${dcp_followup_tmpdir}" \
              "${compute_tmpdir}"
          }
          trap cleanup EXIT

          finish_log() {
            local name="$1"
            local status="$2"
            local log_path="npu-test-logs/${name}.log"

            if [[ "${status}" -eq 0 ]]; then
              tail -n 40 "${log_path}" >"${log_path}.compact"
              mv "${log_path}.compact" "${log_path}"
              cat "${log_path}"
            else
              echo "Last 240 lines from ${log_path}:"
              tail -n 240 "${log_path}"
            fi
          }

          run_test() {
            local name="$1"
            local devices="$2"
            local selector="$3"
            local test_tmpdir="$4"
            local timeout_seconds="$5"
            local active_pid
            local completed_pid
            local completed_status
            local started_at
            local status
            local timer_pid

            started_at=${SECONDS}
            echo "START: ${name} devices=${devices} TMPDIR=${test_tmpdir}"

            (
              export ASCEND_RT_VISIBLE_DEVICES="${devices}"
              export TMPDIR="${test_tmpdir}"
              timeout --kill-after=60s "${timeout_seconds}s" \
                pytest -q -p scripts.ci_test_report "${selector}"
            ) >"npu-test-logs/${name}.log" 2>&1 &
            active_pid=$!

            while true; do
              sleep 60 &
              timer_pid=$!

              set +e
              wait -n -p completed_pid "${active_pid}" "${timer_pid}"
              completed_status=$?
              set -e

              if [[ "${completed_pid}" == "${active_pid}" ]]; then
                status=${completed_status}
                kill "${timer_pid}" 2>/dev/null || true
                wait "${timer_pid}" 2>/dev/null || true
                break
              fi

              echo "PROGRESS: ${name} elapsed=$((SECONDS - started_at))s"
              du -sh "${test_tmpdir}" 2>/dev/null || true
            done

            if [[ "${status}" -eq 0 ]]; then
              echo "PASS: ${name} elapsed=$((SECONDS - started_at))s"
            else
              echo "FAIL: ${name} status=${status} elapsed=$((SECONDS - started_at))s"
            fi
            finish_log "${name}" "${status}"
            return "${status}"
          }

          start_normal_test() {
            local name="$1"
            local devices="$2"
            local selector="$3"

            echo "START: ${name} devices=${devices}"
            (
              export ASCEND_RT_VISIBLE_DEVICES="${devices}"
              export TMPDIR="${lane_tmpdir}"
              timeout --kill-after=60s 900s \
                pytest -q -p scripts.ci_test_report "${selector}"
            ) >"npu-test-logs/${name}.log" 2>&1 &
            pids+=("$!")
            names+=("${name}")
          }

          wait_for_normal_wave() {
            local index
            local status

            for index in "${!pids[@]}"; do
              if wait "${pids[$index]}"; then
                status=0
                echo "PASS: ${names[$index]}"
              else
                status=$?
                echo "FAIL: ${names[$index]} status=${status}"
                failed=1
              fi
              finish_log "${names[$index]}" "${status}"
            done

            pids=()
            names=()
          }

          checkpoint_lane() {
            local failed=0
            local lane_tmpdir="${dcp_followup_tmpdir}"
            local -a names=()
            local -a pids=()

            run_test \
              qwen3-30b-dcp-save-load \
              8,9,10,11,12,13,14,15 \
              tests/test_megatron_engine_distributed.py::test_qwen3moe_dcp_save_load \
              "${dcp_tmpdir}" \
              1200 \
              || failed=1
            rm -rf -- "${dcp_tmpdir}"

            start_normal_test \
              qwen35-hf-save-load \
              8,9 \
              tests/test_megatron_engine_distributed.py::test_qwen3_5_hf_save_load
            start_normal_test \
              qwen35-tp2 \
              10,11 \
              tests/test_megatron_engine_distributed.py::test_qwen3_5_tensor_parallel
            start_normal_test \
              qwen35-pp2 \
              12,13 \
              tests/test_megatron_engine_distributed.py::test_qwen3_5_pipeline_parallel
            start_normal_test \
              qwen35-single-forward \
              14 \
              tests/test_megatron_engine_distributed.py::test_qwen3_5_single_gpu_forward
            start_normal_test \
              distributed-lock \
              15 \
              'tests/test_lock.py::test_distributed_lock_single_rank[1]'
            wait_for_normal_wave

            return "${failed}"
          }

          compute_lane() {
            local failed=0
            local lane_tmpdir="${compute_tmpdir}"
            local -a names=()
            local -a pids=()

            run_test \
              qwen35-35b-hf-save-load \
              0,1,2,3,4,5,6,7 \
              tests/test_megatron_engine_distributed.py::test_qwen3_5_moe_hf_save_load \
              "${hf_tmpdir}" \
              1800 \
              || failed=1
            rm -rf -- "${hf_tmpdir}"

            run_test \
              qwen35-35b-expert-parallel \
              0,1,2,3,4,5,6,7 \
              tests/test_megatron_engine_distributed.py::test_qwen3_5_moe_expert_parallel \
              "${compute_tmpdir}" \
              1200 \
              || failed=1
            run_test \
              qwen3-30b-expert-parallel \
              0,1,2,3,4,5,6,7 \
              tests/test_megatron_engine_distributed.py::test_qwen3moe_expert_parallel \
              "${compute_tmpdir}" \
              1200 \
              || failed=1

            start_normal_test \
              qwen3-grad-norm \
              0,1 \
              tests/test_megatron_engine_distributed.py::test_qwen3_grad_norm_mb_invariance
            start_normal_test \
              qwen3-tp2 \
              2,3 \
              tests/test_megatron_engine_distributed.py::test_qwen3_tensor_parallel
            start_normal_test \
              qwen3-pp2 \
              4,5 \
              tests/test_megatron_engine_distributed.py::test_qwen3_pipeline_parallel
            start_normal_test \
              qwen3-vpp2 \
              6,7 \
              tests/test_megatron_engine_distributed.py::test_qwen3_virtual_pipeline_parallel
            wait_for_normal_wave

            start_normal_test \
              qwen3-cp2 \
              0,1 \
              tests/test_megatron_engine_distributed.py::test_qwen3_context_parallel
            start_normal_test \
              ulysses \
              2,3 \
              'tests/test_ulysses.py::test_ulysses[2]'
            start_normal_test \
              vocab-parallel \
              4,5 \
              'tests/test_vocab_parallel.py::test_vocab_parallel[2]'
            start_normal_test \
              perf-tracer \
              6,7 \
              tests/test_perf_tracer.py::test_perf_tracer_torchrun_multi_rank
            wait_for_normal_wave

            start_normal_test \
              distributed-lock2 \
              0,1 \
              'tests/test_lock.py::test_distributed_lock_multi_rank[2]'
            start_normal_test \
              vocab-parallel4 \
              2,3,4,5 \
              'tests/test_vocab_parallel.py::test_vocab_parallel[4]'
            wait_for_normal_wave

            return "${failed}"
          }

          checkpoint_lane &
          checkpoint_pid=$!
          compute_lane &
          compute_pid=$!

          failed=0
          if wait "${checkpoint_pid}"; then
            echo "PASS: checkpoint lane"
          else
            echo "FAIL: checkpoint lane"
            failed=1
          fi
          checkpoint_pid=""

          if wait "${compute_pid}"; then
            echo "PASS: compute lane"
          else
            echo "FAIL: compute lane"
            failed=1
          fi
          compute_pid=""

          exit "${failed}"

      - name: Report NPU test counts
        if: always()
        env:
          NPU_TEST_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail

          if [[ ! -d /tmp/current-npu-test-reports ]]; then
            echo "NPU test report was not produced"
            exit 0
          fi

          report_args=(
            --current /tmp/current-npu-test-reports
            --suite NPU
            --step-summary "${GITHUB_STEP_SUMMARY}"
          )
          if [[ -d /tmp/base-npu-test-reports ]]; then
            git -c safe.directory="${GITHUB_WORKSPACE}" \
              diff --name-only "${NPU_TEST_BASE_SHA}" HEAD -- tests \
              > /tmp/changed-npu-test-files.txt
            report_args+=(
              --base /tmp/base-npu-test-reports
              --base-sha "${NPU_TEST_BASE_SHA}"
              --base-is-inventory
              --changed-test-files /tmp/changed-npu-test-files.txt
              --unavailable-base-test-files /tmp/unavailable-base-npu-test-files.txt
            )
          fi
          python scripts/ci_test_report.py summarize "${report_args[@]}"

      - name: Upload NPU test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: npu-pr-test-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: npu-test-logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Collect final NPU diagnostics
        if: always()
        run: npu-smi info || true
