name: Ascend PR Tests

on:
  pull_request:
    branches:
      - ascend
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ascend-pr-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  pre-commit:
    name: pre-commit
    if: github.repository == 'areal-project/AReaL'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.18"
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.11

      - name: Install development environment
        run: uv sync --frozen --group dev

      - name: Run pre-commit
        run: uv run pre-commit run --all-files

  cpu-unit-tests:
    name: cpu-unit-tests
    if: github.repository == 'areal-project/AReaL'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      AREAL_IS_IN_CI: "1"
      CPU_TEST_BASE_SHA: ""
      HF_HOME: "${{ github.workspace }}/.cache/huggingface"
      HF_HUB_DISABLE_XET: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
      NO_PROXY: "127.0.0.1,localhost"
      UV_HTTP_RETRIES: "5"
      UV_HTTP_TIMEOUT: "300"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.18"
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock
          save-cache: false

      - name: Set up Python
        run: uv python install 3.11

      - name: Install CPU test environment
        run: uv sync --frozen --group dev

      - name: Verify CPU-only environment
        run: |
          uv run python - <<'PY'
          import torch

          print("torch:", torch.__version__)
          print("CUDA available:", torch.cuda.is_available())
          assert not torch.cuda.is_available()
          PY

      - name: Pre-download slow-test artifacts
        env:
          HF_HUB_OFFLINE: "0"
          TRANSFORMERS_OFFLINE: "0"
          HF_DATASETS_OFFLINE: "0"
        run: |
          set -euo pipefail

          uv run hf --version

          download_with_retry() {
            local attempt
            local delay

            for attempt in 1 2 3 4 5; do
              if "$@"; then
                return 0
              fi

              if [[ "${attempt}" -lt 5 ]]; then
                delay=$((attempt * 30))
                echo "Download attempt ${attempt} failed; retrying in ${delay}s"
                sleep "${delay}"
              fi
            done

            echo "Download failed after 5 attempts"
            return 1
          }

          download_with_retry \
            uv run hf download \
            openai/gsm8k \
            --repo-type dataset \
            --max-workers 4

          download_with_retry \
            uv run hf download \
            hiyouga/geometry3k \
            --repo-type dataset \
            --max-workers 4

          download_with_retry \
            uv run hf download \
            Qwen/Qwen3-0.6B \
            --exclude "*.safetensors" \
            --max-workers 4

          download_with_retry \
            uv run hf download \
            Qwen/Qwen2.5-VL-3B-Instruct \
            --exclude "*.safetensors" \
            --max-workers 4

      - name: Collect base CPU tests
        if: github.event_name != 'workflow_dispatch'
        env:
          AREAL_TEST_REPORT_DIR: /tmp/base-cpu-test-reports
          CPU_TEST_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail

          if [[ -z "${CPU_TEST_BASE_SHA}" || "${CPU_TEST_BASE_SHA}" =~ ^0+$ ]] || \
            ! git cat-file -e "${CPU_TEST_BASE_SHA}^{tree}" 2>/dev/null; then
            if [[ "${GITHUB_EVENT_NAME}" == "push" ]] && \
              fallback_base_sha="$(git rev-parse --verify HEAD^ 2>/dev/null)"; then
              echo "Base commit ${CPU_TEST_BASE_SHA:-<none>} is unavailable; comparing with ${fallback_base_sha}"
              CPU_TEST_BASE_SHA="${fallback_base_sha}"
            else
              echo "No reachable base commit is available; skipping the comparison"
              exit 0
            fi
          fi
          echo "CPU_TEST_BASE_SHA=${CPU_TEST_BASE_SHA}" >> "${GITHUB_ENV}"

          base_dir="$(mktemp -d)"
          plugin_dir="$(mktemp -d)"
          cleanup() {
            rm -rf -- "${base_dir}" "${plugin_dir}"
          }
          trap cleanup EXIT

          cp scripts/ci_test_report.py "${plugin_dir}/ci_test_report.py"
          if ! git archive "${CPU_TEST_BASE_SHA}" | tar -x -C "${base_dir}"; then
            echo "::warning title=Base CPU comparison unavailable::Could not extract ${CPU_TEST_BASE_SHA}"
            rm -rf -- /tmp/base-cpu-test-reports
            exit 0
          fi

          if ! (
            cd "${base_dir}"
            "${GITHUB_WORKSPACE}/.venv/bin/python" scripts/select_cpu_tests.py \
              --ignore tests/experimental/archon \
              > /tmp/base-cpu-test-files.txt
            mapfile -t base_cpu_test_files < /tmp/base-cpu-test-files.txt
            test "${#base_cpu_test_files[@]}" -gt 0
            PYTHONPATH="${plugin_dir}:${base_dir}" \
              "${GITHUB_WORKSPACE}/.venv/bin/python" -m pytest -q \
              --collect-only \
              -p ci_test_report \
              -m "not npu and not multi_npu and not cuda and not nccl and not sglang and not vllm and not integration" \
              "${base_cpu_test_files[@]}"
          ) > /tmp/base-cpu-collection.log 2>&1; then
            cat /tmp/base-cpu-collection.log
            echo "::warning title=Base CPU comparison unavailable::Base test collection failed"
            rm -rf -- /tmp/base-cpu-test-reports
            exit 0
          fi

      - name: Run CPU unit tests
        env:
          AREAL_TEST_REPORT_DIR: /tmp/current-cpu-test-reports
        run: |
          set -euo pipefail

          uv run python scripts/select_cpu_tests.py \
            --ignore tests/experimental/archon \
            > /tmp/cpu-test-files.txt
          mapfile -t cpu_test_files < /tmp/cpu-test-files.txt
          test "${#cpu_test_files[@]}" -gt 0
          printf 'Selected %s CPU test modules\n' "${#cpu_test_files[@]}"
          uv run pytest -q \
            -p scripts.ci_test_report \
            -m "not npu and not multi_npu and not cuda and not nccl and not sglang and not vllm and not integration" \
            "${cpu_test_files[@]}"

      - name: Report CPU test counts
        if: always()
        run: |
          set -euo pipefail

          if [[ ! -d /tmp/current-cpu-test-reports ]]; then
            echo "CPU test report was not produced"
            exit 0
          fi

          report_args=(
            --current /tmp/current-cpu-test-reports
            --suite CPU
            --step-summary "${GITHUB_STEP_SUMMARY}"
          )
          if [[ -d /tmp/base-cpu-test-reports ]]; then
            git diff --name-only "${CPU_TEST_BASE_SHA}" HEAD -- tests \
              > /tmp/changed-cpu-test-files.txt
            report_args+=(
              --base /tmp/base-cpu-test-reports
              --base-sha "${CPU_TEST_BASE_SHA}"
              --changed-test-files /tmp/changed-cpu-test-files.txt
            )
          fi
          uv run python scripts/ci_test_report.py summarize "${report_args[@]}"

  npu-pr-tests:
    name: npu-pr-tests
    if: github.repository == 'areal-project/AReaL'
    runs-on: linux-aarch64-a3-800i-8
    timeout-minutes: 135
    container:
      image: swr.cn-north-12.myhuaweicloud.com/ascend/areal_npu:a3-nightly

    env:
      AREAL_IS_IN_CI: "1"
      NPU_TEST_BASE_SHA: ""
      AREAL_E2E_WORK_DIR: "/tmp/areal-e2e-${{ github.run_id }}-${{ github.run_attempt }}"
      AREAL_TEST_QWEN3_PATH: "/root/.cache/modelscope/hub/models/Qwen/Qwen3-0.6B"
      AREAL_TEST_QWEN35_PATH: "/root/.cache/modelscope/hub/models/Qwen/Qwen3.5-0.8B"
      HF_ENDPOINT: "https://hf-mirror.com"
      HF_HUB_DISABLE_XET: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          clean: true

      - name: Install current AReaL repository
        run: |
          set -euo pipefail

          cp pyproject.npu.toml pyproject.toml
          pip install -e . --no-deps
          python - <<'PY'
          import importlib.metadata
          import tomllib

          with open("pyproject.toml", "rb") as project_file:
              expected = tomllib.load(project_file)["project"]["version"]
          actual = importlib.metadata.version("areal")
          print(f"AReaL version: {actual}")
          assert actual == expected, f"areal reports {actual}, expected {expected}"
          PY

      - name: Collect base NPU test inventory
        if: github.event_name != 'workflow_dispatch'
        env:
          AREAL_TEST_REPORT_DIR: /tmp/base-npu-test-reports
          NPU_TEST_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail

          if [[ -z "${NPU_TEST_BASE_SHA}" || "${NPU_TEST_BASE_SHA}" =~ ^0+$ ]] || \
            ! git -c safe.directory="${GITHUB_WORKSPACE}" \
              cat-file -e "${NPU_TEST_BASE_SHA}^{tree}" 2>/dev/null; then
            if [[ "${GITHUB_EVENT_NAME}" == "push" ]] && \
              fallback_base_sha="$(git -c safe.directory="${GITHUB_WORKSPACE}" \
                rev-parse --verify HEAD^ 2>/dev/null)"; then
              echo "Base commit ${NPU_TEST_BASE_SHA:-<none>} is unavailable; comparing with ${fallback_base_sha}"
              NPU_TEST_BASE_SHA="${fallback_base_sha}"
            else
              echo "No reachable base commit is available; skipping the comparison"
              exit 0
            fi
          fi
          echo "NPU_TEST_BASE_SHA=${NPU_TEST_BASE_SHA}" >> "${GITHUB_ENV}"

          base_dir="$(mktemp -d)"
          plugin_dir="$(mktemp -d)"
          cleanup() {
            rm -rf -- "${base_dir}" "${plugin_dir}"
          }
          trap cleanup EXIT

          cp scripts/ci_test_report.py "${plugin_dir}/ci_test_report.py"
          if ! git -c safe.directory="${GITHUB_WORKSPACE}" \
            archive "${NPU_TEST_BASE_SHA}" | tar -x -C "${base_dir}"; then
            echo "::warning title=Base NPU comparison unavailable::Could not extract ${NPU_TEST_BASE_SHA}"
            rm -rf -- /tmp/base-npu-test-reports
            exit 0
          fi
          : > /tmp/unavailable-base-npu-test-files.txt

          collect_base_tests() {
            local name="$1"
            local status
            local test_file="${!#}"
            shift

            if [[ ! -f "${base_dir}/${test_file}" ]]; then
              echo "Base test file does not exist: ${test_file}"
              return 0
            fi

            set +e
            (
              cd "${base_dir}"
              PYTHONPATH="${plugin_dir}:${base_dir}:${PYTHONPATH:-}" \
                python -m pytest -q \
                --collect-only \
                -p ci_test_report \
                "$@"
            ) > "/tmp/base-npu-${name}.log" 2>&1
            status=$?
            set -e

            if [[ "${status}" -ne 0 ]]; then
              printf '%s\n' "${test_file}" \
                >> /tmp/unavailable-base-npu-test-files.txt
              echo "::warning title=Base NPU inventory unavailable::${test_file} exited with status ${status}"
              tail -n 40 "/tmp/base-npu-${name}.log"
            fi
          }

          collect_base_tests megatron-vlm \
            --deselect tests/test_megatron_engine_vlm.py::TestVisionModelDetection \
            tests/test_megatron_engine_vlm.py
          collect_base_tests model-packed-seq-cp \
            tests/test_model_packed_seq_cp.py
          collect_base_tests megatron-bridge-vision-cp \
            tests/test_megatron_bridge_vision_cp.py
          collect_base_tests reassemble-cp-logprobs \
            -m skipif tests/test_reassemble_cp_logprobs.py
          collect_base_tests megatron-distributed \
            tests/test_megatron_engine_distributed.py
          collect_base_tests megatron-loss-aggregation \
            tests/test_megatron_loss_aggregation.py
          collect_base_tests ppo-advantages tests/test_ppo_advantages.py
          collect_base_tests lock tests/test_lock.py
          collect_base_tests perf-tracer tests/test_perf_tracer.py
          collect_base_tests ulysses tests/test_ulysses.py
          collect_base_tests vocab-parallel tests/test_vocab_parallel.py
          collect_base_tests exact-token-contract \
            tests/experimental/inference_service/test_exact_token_contract_integration.py
          collect_base_tests geometry3k-e2e tests/test_ascend_training_e2e.py

      - name: Verify NPU runtime
        run: |
          set -euo pipefail

          python - <<'PY'
          import torch
          import torch_npu

          print("torch:", torch.__version__)
          print("torch_npu:", torch_npu.__version__)
          print("NPU available:", torch.npu.is_available())
          print("NPU count:", torch.npu.device_count())

          assert torch.npu.is_available()
          assert torch.npu.device_count() >= 8
          PY

          npu-smi info

      - name: Resolve cached NPU test models
        run: |
          set -euo pipefail

          verify_model() {
            local model_path="$1"
            local weight_file

            [[ -f "${model_path}/config.json" ]] || return 1
            weight_file=$(find -L "${model_path}" -maxdepth 1 -type f \
              \( -name '*.safetensors' -o -name '*.bin' \) -print -quit)
            [[ -n "${weight_file}" ]]
          }

          resolve_model() {
            local env_name="$1"
            local model_name="$2"
            local encoded_name="${model_name//./___}"
            local modelscope_root="${HOME}/.cache/modelscope/hub/models"
            local huggingface_root="${HF_HUB_CACHE:-${HF_HOME:-${HOME}/.cache/huggingface}/hub}"
            local candidate
            local -a candidates=(
              "${!env_name}"
              "${modelscope_root}/Qwen/${model_name}"
              "${modelscope_root}/Qwen/${encoded_name}"
              "${modelscope_root}/${model_name}"
              "${modelscope_root}/${encoded_name}"
              "${huggingface_root}/models--Qwen--${model_name}/snapshots/"*
            )

            for candidate in "${candidates[@]}"; do
              if verify_model "${candidate}"; then
                echo "${env_name}=${candidate}" >> "${GITHUB_ENV}"
                echo "Using cached model for ${model_name}: ${candidate}"
                return 0
              fi
            done

            echo "::error title=Cached model unavailable::${model_name} requires config.json and a top-level .safetensors or .bin weight file"
            printf 'Checked: %s\n' "${candidates[@]}"
            return 1
          }

          failed=0
          resolve_model AREAL_TEST_QWEN3_PATH Qwen3-0.6B || failed=1
          resolve_model AREAL_TEST_QWEN35_PATH Qwen3.5-0.8B || failed=1
          exit "${failed}"

      - name: Run NPU-image dependency tests
        env:
          AREAL_TEST_REPORT_DIR: /tmp/current-npu-test-reports
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: |
          pytest -q -p scripts.ci_test_report \
            --deselect tests/test_megatron_engine_vlm.py::TestVisionModelDetection \
            tests/test_megatron_engine_vlm.py
          pytest -q -p scripts.ci_test_report \
            tests/test_model_packed_seq_cp.py
          pytest -q -p scripts.ci_test_report \
            -m skipif tests/test_reassemble_cp_logprobs.py

      - name: Run NPU test suites
        env:
          AREAL_TEST_REPORT_DIR: /tmp/current-npu-test-reports
          HF_HUB_OFFLINE: "1"
          PYTHONWARNINGS: "ignore"
          TRANSFORMERS_OFFLINE: "1"
        run: |
          set -euo pipefail

          export AREAL_TEST_VLM_PATH="${AREAL_TEST_QWEN35_PATH}"

          mkdir -p npu-test-logs

          hf_tmpdir=$(mktemp -d \
            "/tmp/areal-ci-hf-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-XXXXXX")
          qwen35_tmpdir=$(mktemp -d \
            "/tmp/areal-ci-qwen35-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-XXXXXX")
          compute_tmpdir=$(mktemp -d \
            "/tmp/areal-ci-compute-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-XXXXXX")

          cleanup() {
            rm -rf -- \
              "${hf_tmpdir}" \
              "${qwen35_tmpdir}" \
              "${compute_tmpdir}"
          }
          trap cleanup EXIT

          python -m tests.moe_checkpoint_fixtures \
            --output-dir "${compute_tmpdir}/models"
          export AREAL_TEST_QWEN3_MOE_PATH="${compute_tmpdir}/models/qwen3moe"
          export AREAL_TEST_QWEN35_MOE_PATH="${compute_tmpdir}/models/qwen3_5_moe"
          du -sh "${AREAL_TEST_QWEN3_MOE_PATH}" "${AREAL_TEST_QWEN35_MOE_PATH}"

          finish_log() {
            local name="$1"
            local status="$2"
            local log_path="npu-test-logs/${name}.log"

            if [[ "${status}" -eq 0 ]]; then
              tail -n 40 "${log_path}" >"${log_path}.compact"
              mv "${log_path}.compact" "${log_path}"
              cat "${log_path}"
            else
              echo "Last 240 lines from ${log_path}:"
              tail -n 240 "${log_path}"
            fi
          }

          run_test() {
            local name="$1"
            local devices="$2"
            local selector="$3"
            local test_tmpdir="$4"
            local timeout_seconds="$5"
            local active_pid
            local completed_pid
            local completed_status
            local started_at
            local status
            local timer_pid

            started_at=${SECONDS}
            echo "START: ${name} devices=${devices} TMPDIR=${test_tmpdir}"

            (
              export ASCEND_RT_VISIBLE_DEVICES="${devices}"
              export TMPDIR="${test_tmpdir}"
              timeout --kill-after=60s "${timeout_seconds}s" \
                pytest -q -p scripts.ci_test_report "${selector}"
            ) >"npu-test-logs/${name}.log" 2>&1 &
            active_pid=$!

            while true; do
              sleep 60 &
              timer_pid=$!

              set +e
              wait -n -p completed_pid "${active_pid}" "${timer_pid}"
              completed_status=$?
              set -e

              if [[ "${completed_pid}" == "${active_pid}" ]]; then
                status=${completed_status}
                kill "${timer_pid}" 2>/dev/null || true
                wait "${timer_pid}" 2>/dev/null || true
                break
              fi

              echo "PROGRESS: ${name} elapsed=$((SECONDS - started_at))s"
              du -sh "${test_tmpdir}" 2>/dev/null || true
            done

            if [[ "${status}" -eq 0 ]]; then
              echo "PASS: ${name} elapsed=$((SECONDS - started_at))s"
            else
              echo "FAIL: ${name} status=${status} elapsed=$((SECONDS - started_at))s"
            fi
            finish_log "${name}" "${status}"
            return "${status}"
          }

          start_normal_test() {
            local name="$1"
            local devices="$2"
            shift 2

            echo "START: ${name} devices=${devices}"
            (
              export ASCEND_RT_VISIBLE_DEVICES="${devices}"
              export TMPDIR="${wave_tmpdir}"
              timeout --kill-after=60s 900s \
                pytest -q -p scripts.ci_test_report "$@"
            ) >"npu-test-logs/${name}.log" 2>&1 &
            pids+=("$!")
            names+=("${name}")
          }

          wait_for_normal_wave() {
            local index
            local status

            for index in "${!pids[@]}"; do
              if wait "${pids[$index]}"; then
                status=0
                echo "PASS: ${names[$index]}"
              else
                status=$?
                echo "FAIL: ${names[$index]} status=${status}"
                failed=1
              fi
              finish_log "${names[$index]}" "${status}"
            done

            pids=()
            names=()
          }

          run_qwen35_tests() {
            local failed=0
            local wave_tmpdir="${qwen35_tmpdir}"
            local -a names=()
            local -a pids=()

            start_normal_test \
              qwen35-hf-save-load \
              0,1 \
              tests/test_megatron_engine_distributed.py::test_qwen3_5_hf_save_load
            start_normal_test \
              qwen35-tp2 \
              2,3 \
              tests/test_megatron_engine_distributed.py::test_qwen3_5_tensor_parallel
            start_normal_test \
              qwen35-pp2 \
              4,5 \
              tests/test_megatron_engine_distributed.py::test_qwen3_5_pipeline_parallel
            start_normal_test \
              exact-token-contract \
              7 \
              tests/experimental/inference_service/test_exact_token_contract_integration.py
            run_test \
              qwen35-single-forward \
              6 \
              tests/test_megatron_engine_distributed.py::test_qwen3_5_single_gpu_forward \
              "${wave_tmpdir}" \
              900 \
              || failed=1
            start_normal_test \
              distributed-lock \
              6 \
              'tests/test_lock.py::test_distributed_lock_single_rank[1]'
            wait_for_normal_wave

            return "${failed}"
          }

          run_compute_tests() {
            local failed=0
            local wave_tmpdir="${compute_tmpdir}"
            local -a names=()
            local -a pids=()

            run_test \
              qwen35-moe-hf-save-load \
              0,1,2,3,4,5,6,7 \
              tests/test_megatron_engine_distributed.py::test_qwen3_5_moe_hf_save_load \
              "${hf_tmpdir}" \
              1800 \
              || failed=1
            rm -rf -- "${hf_tmpdir}"

            run_test \
              qwen35-moe-expert-parallel \
              0,1,2,3,4,5,6,7 \
              tests/test_megatron_engine_distributed.py::test_qwen3_5_moe_expert_parallel \
              "${compute_tmpdir}" \
              1200 \
              || failed=1
            run_test \
              qwen3-moe-expert-parallel \
              0,1,2,3,4,5,6,7 \
              tests/test_megatron_engine_distributed.py::test_qwen3moe_expert_parallel \
              "${compute_tmpdir}" \
              1200 \
              || failed=1

            start_normal_test \
              qwen3-grad-norm \
              0,1 \
              tests/test_megatron_engine_distributed.py::test_qwen3_grad_norm_mb_invariance
            start_normal_test \
              qwen3-tp2 \
              2,3 \
              tests/test_megatron_engine_distributed.py::test_qwen3_tensor_parallel
            start_normal_test \
              qwen3-pp2 \
              4,5 \
              tests/test_megatron_engine_distributed.py::test_qwen3_pipeline_parallel
            start_normal_test \
              qwen3-vpp2 \
              6,7 \
              tests/test_megatron_engine_distributed.py::test_qwen3_virtual_pipeline_parallel
            wait_for_normal_wave

            start_normal_test \
              qwen3-cp2 \
              0,1 \
              tests/test_megatron_engine_distributed.py::test_qwen3_context_parallel
            start_normal_test \
              ulysses \
              2,3 \
              'tests/test_ulysses.py::test_ulysses[2]'
            start_normal_test \
              vocab-parallel \
              4,5 \
              'tests/test_vocab_parallel.py::test_vocab_parallel[2]'
            start_normal_test \
              perf-tracer \
              6,7 \
              tests/test_perf_tracer.py::test_perf_tracer_torchrun_multi_rank
            wait_for_normal_wave

            start_normal_test \
              distributed-lock2 \
              0,1 \
              'tests/test_lock.py::test_distributed_lock_multi_rank[2]'
            start_normal_test \
              vocab-parallel4 \
              2,3,4,5 \
              'tests/test_vocab_parallel.py::test_vocab_parallel[4]'
            start_normal_test \
              megatron-bridge-vision-cp \
              6,7 \
              tests/test_megatron_bridge_vision_cp.py::test_vision_cp_allgather_backward_hccl
            wait_for_normal_wave

            local loss_selector=tests/test_megatron_loss_aggregation.py::test_real_mcore_loss_aggregation_gradients
            local loss_check

            # Four-device cases: two concurrent tasks per wave.
            for loss_check in main auxiliary; do
              start_normal_test \
                "megatron-loss-aggregation-legacy-${loss_check}-d2c2" \
                0,1,2,3 \
                "${loss_selector}[legacy-${loss_check}-2-2]"
              start_normal_test \
                "megatron-loss-aggregation-update-protocol-${loss_check}-d2c2" \
                4,5,6,7 \
                "${loss_selector}[update-protocol-${loss_check}-2-2]"
              wait_for_normal_wave
            done

            # Two-device cases: four concurrent tasks per wave.
            for loss_check in main auxiliary; do
              start_normal_test \
                "megatron-loss-aggregation-legacy-${loss_check}-d2c1" \
                0,1 \
                "${loss_selector}[legacy-${loss_check}-2-1]"
              start_normal_test \
                "megatron-loss-aggregation-legacy-${loss_check}-d1c2" \
                2,3 \
                "${loss_selector}[legacy-${loss_check}-1-2]"
              start_normal_test \
                "megatron-loss-aggregation-update-protocol-${loss_check}-d2c1" \
                4,5 \
                "${loss_selector}[update-protocol-${loss_check}-2-1]"
              start_normal_test \
                "megatron-loss-aggregation-update-protocol-${loss_check}-d1c2" \
                6,7 \
                "${loss_selector}[update-protocol-${loss_check}-1-2]"
              wait_for_normal_wave
            done

            # The remaining four single-device loss cases share the final wave.
            start_normal_test \
              megatron-loss-aggregation-legacy-main-d1c1 \
              0 \
              "${loss_selector}[legacy-main-1-1]"
            start_normal_test \
              megatron-loss-aggregation-legacy-auxiliary-d1c1 \
              1 \
              "${loss_selector}[legacy-auxiliary-1-1]"
            start_normal_test \
              megatron-loss-aggregation-update-protocol-main-d1c1 \
              2 \
              "${loss_selector}[update-protocol-main-1-1]"
            start_normal_test \
              megatron-loss-aggregation-update-protocol-auxiliary-d1c1 \
              3 \
              "${loss_selector}[update-protocol-auxiliary-1-1]"
            start_normal_test \
              ppo-advantages \
              4 \
              'tests/test_ppo_advantages.py::test_terminal_reward_fastpath_respects_masks_and_truncation[accelerator-False]' \
              'tests/test_ppo_advantages.py::test_terminal_reward_fastpath_respects_masks_and_truncation[accelerator-True]' \
              'tests/test_ppo_advantages.py::test_dense_kl_fastpath_matches_original_gae[accelerator]' \
              'tests/test_ppo_advantages.py::test_critic_or_discounted_gae_keeps_original_recurrence[accelerator-True-1.0-1.0]' \
              'tests/test_ppo_advantages.py::test_critic_or_discounted_gae_keeps_original_recurrence[accelerator-False-0.9-1.0]' \
              'tests/test_ppo_advantages.py::test_critic_or_discounted_gae_keeps_original_recurrence[accelerator-False-1.0-0.8]' \
              'tests/test_ppo_advantages.py::test_fastpath_single_token_sequence_has_zero_advantage[accelerator]'
            wait_for_normal_wave

            return "${failed}"
          }

          failed=0
          if run_qwen35_tests; then
            echo "PASS: Qwen3.5 tests"
          else
            echo "FAIL: Qwen3.5 tests"
            failed=1
          fi

          if run_compute_tests; then
            echo "PASS: compute tests"
          else
            echo "FAIL: compute tests"
            failed=1
          fi

          exit "${failed}"

      - name: Prepare Geometry3K dataset cache
        timeout-minutes: 15
        env:
          HF_HUB_OFFLINE: "0"
          HF_DATASETS_OFFLINE: "0"
        run: |
          set -euo pipefail

          prepare_dataset() {
            python - <<'PY'
          from datasets import load_dataset

          for split in ("train", "test"):
              dataset = load_dataset("hiyouga/geometry3k", split=split)
              assert len(dataset) > 0, f"Geometry3K {split} split is empty"
              print(f"Cached Geometry3K {split}: {len(dataset)} examples")
          PY
          }

          if HF_HUB_OFFLINE=1 HF_DATASETS_OFFLINE=1 prepare_dataset; then
            exit 0
          fi

          for attempt in 1 2 3; do
            if prepare_dataset; then
              exit 0
            fi
            if [[ "${attempt}" -lt 3 ]]; then
              echo "Geometry3K download attempt ${attempt} failed; retrying"
              sleep "$((attempt * 30))"
            fi
          done
          echo "::error::Geometry3K preparation failed after 3 attempts"
          exit 1

      - name: Run Geometry3K training E2E
        timeout-minutes: 32
        env:
          AREAL_TEST_REPORT_DIR: /tmp/current-npu-test-reports
          AREAL_E2E_OUTPUT_DIR: "${{ github.workspace }}/npu-test-logs/geometry3k-e2e"
          ASCEND_RT_VISIBLE_DEVICES: "0,1,2,3,4,5,6,7"
          HF_HUB_OFFLINE: "1"
          HF_DATASETS_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: |
          set -euo pipefail

          mkdir -p npu-test-logs
          timeout --kill-after=60s 1800s \
            pytest -q -s -p scripts.ci_test_report tests/test_ascend_training_e2e.py \
            2>&1 | tee npu-test-logs/geometry3k-e2e.log

      - name: Print Geometry3K training logs and clean temporary files
        if: always()
        run: |
          set -euo pipefail

          cleanup() {
            rm -rf -- "${AREAL_E2E_WORK_DIR:?}"
          }
          trap cleanup EXIT

          # Preserve worker logs if pytest was interrupted before its finally block.
          for workdir in "${AREAL_E2E_WORK_DIR}"/geometry3k-e2e-*; do
            if [[ -d "${workdir}/logs" ]]; then
              mkdir -p npu-test-logs/geometry3k-e2e/workers
              cp -a "${workdir}/logs/." npu-test-logs/geometry3k-e2e/workers/
            fi
          done

          if [[ -f npu-test-logs/geometry3k-e2e/controller.log ]]; then
            echo "::group::Geometry3K AReaL training log"
            cat npu-test-logs/geometry3k-e2e/controller.log
            echo "::endgroup::"
          fi
          cleanup
          test ! -e "${AREAL_E2E_WORK_DIR}"
          echo "Geometry3K temporary training files cleaned up"

      - name: Report NPU test counts
        if: always()
        run: |
          set -euo pipefail

          if [[ ! -d /tmp/current-npu-test-reports ]]; then
            echo "NPU test report was not produced"
            exit 0
          fi

          report_args=(
            --current /tmp/current-npu-test-reports
            --suite NPU
            --step-summary "${GITHUB_STEP_SUMMARY}"
          )
          if [[ -d /tmp/base-npu-test-reports ]]; then
            git -c safe.directory="${GITHUB_WORKSPACE}" \
              diff --name-only "${NPU_TEST_BASE_SHA}" HEAD -- tests \
              > /tmp/changed-npu-test-files.txt
            report_args+=(
              --base /tmp/base-npu-test-reports
              --base-sha "${NPU_TEST_BASE_SHA}"
              --base-is-inventory
              --changed-test-files /tmp/changed-npu-test-files.txt
              --unavailable-base-test-files /tmp/unavailable-base-npu-test-files.txt
            )
          fi
          python scripts/ci_test_report.py summarize "${report_args[@]}"

      - name: Upload NPU test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: npu-pr-test-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: npu-test-logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Collect final NPU diagnostics
        if: always()
        run: npu-smi info || true
