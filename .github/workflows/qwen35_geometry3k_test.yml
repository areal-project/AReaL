name: AReaL Kubernetes Permission Probe

on:
  workflow_dispatch:
  push:
    branches:
      - ci/vlm-npu-nightly

jobs:
  probe:
    runs-on: linux-aarch64-a3-16

    steps:
      - name: Check Kubernetes permissions
        shell: bash
        run: |
          set -Eeuo pipefail

          SA_DIR=/var/run/secrets/kubernetes.io/serviceaccount
          TOKEN="$(cat "${SA_DIR}/token")"
          NAMESPACE="$(cat "${SA_DIR}/namespace")"
          CA="${SA_DIR}/ca.crt"
          API="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT_HTTPS}"

          echo "Namespace: ${NAMESPACE}"
          echo "Runner pod: $(hostname)"

          check_permission() {
            local verb="$1"
            local resource="$2"
            local subresource="${3:-}"

            cat > /tmp/review.json <<EOF
          {
            "apiVersion": "authorization.k8s.io/v1",
            "kind": "SelfSubjectAccessReview",
            "spec": {
              "resourceAttributes": {
                "namespace": "${NAMESPACE}",
                "verb": "${verb}",
                "group": "",
                "resource": "${resource}",
                "subresource": "${subresource}"
              }
            }
          }
          EOF

            echo "=== ${verb} ${resource}${subresource:+/${subresource}} ==="

            curl --fail-with-body \
              --silent \
              --show-error \
              --cacert "${CA}" \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Content-Type: application/json" \
              -X POST \
              --data-binary @/tmp/review.json \
              "${API}/apis/authorization.k8s.io/v1/selfsubjectaccessreviews"

            echo
          }

          check_permission create pods
          check_permission get pods
          check_permission delete pods
          check_permission get pods log