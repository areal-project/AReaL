name: Probe Ascend A3 Runner

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: linux-aarch64-a3-16
    timeout-minutes: 20

    container:
      image: swr.cn-southwest-2.myhuaweicloud.com/modelfoundry/ascend-ci/verl/verl:verl-9.0.0-a3-ubuntu22.04-py3.11-latest

    steps:
      - name: Show NPU information
        shell: bash
        run: |
          set -euxo pipefail

          npu-smi info

          python - <<'PY'
          import torch
          import torch_npu

          count = torch.npu.device_count()
          print("Visible NPU count:", count)
          assert count == 16, f"Expected 16 NPUs, found {count}"
          PY