name: Qwen3.5-2B Geometry3K GRPO Test

on:
  push:
    branches:
      - ci/vlm-npu-nightly

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qwen35-geometry3k-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: linux-aarch64-a3-16

    steps:
      - name: Test host Docker
        run: |
          set -euxo pipefail
          docker version
          docker run --rm ubuntu:22.04 uname -a