name: Qwen3.5 Geometry3K GRPO

on:
  push:
    branches:
      - ci/vlm-npu-nightly

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qwen35-geometry3k
  cancel-in-progress: true

env:
  AREAL_IMAGE: ghcr.io/hwvanici/areal_npu:v1.0.4-a3

  # This may also be a branch name later.
  AREAL_REF: ascend

  NPU_RESOURCE: huawei.com/Ascend910
  NPU_COUNT: "16"

jobs:
  probe-npu-resources:
    runs-on: linux-aarch64-a3-16
    timeout-minutes: 10

    steps:
      - name: Show NPU resource names and capacities
        shell: bash
        run: |
          set -Eeuo pipefail

          SA=/var/run/secrets/kubernetes.io/serviceaccount
          TOKEN="$(cat "${SA}/token")"
          CA="${SA}/ca.crt"

          API="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT_HTTPS}"

          command -v curl >/dev/null
          command -v jq >/dev/null

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --cacert "${CA}" \
            -H "Authorization: Bearer ${TOKEN}" \
            "${API}/api/v1/nodes" \
            > /tmp/nodes.json

          echo "=== NPU resources by node ==="

          jq -r '
            ["NODE", "RESOURCE", "CAPACITY", "ALLOCATABLE"],
            (
              .items[] as $node
              | ($node.status.capacity // {})
              | to_entries[]
              | select(
                  .key
                  | test("huawei|ascend|npu"; "i")
                )
              | [
                  $node.metadata.name,
                  .key,
                  .value,
                  (
                    $node.status.allocatable[.key]
                    // "0"
                  )
                ]
            )
            | @tsv
          ' /tmp/nodes.json |
            if command -v column >/dev/null; then
              column -t -s $'\t'
            else
              cat
            fi

          echo
          echo "=== Unique NPU resource names ==="

          jq -r '
            .items[]
            | (.status.capacity // {})
            | keys[]
            | select(test("huawei|ascend|npu"; "i"))
          ' /tmp/nodes.json |
            sort -u