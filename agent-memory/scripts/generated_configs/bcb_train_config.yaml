llm:
  provider: openai
  api_key: "sk-43dd5f664179406d92fec42a9364f8a5"
  base_url: "http://127.0.0.1:33601/v1"
  model: gpt-4o-2024-11-20
  temperature: 0.0
  max_tokens: 12800

embedding:
  provider: openai
  api_key: "sk-43dd5f664179406d92fec42a9364f8a5"
  base_url: "http://127.0.0.1:33601/v1"
  model: text-embedding-3-small
  max_text_len: 8196

memory:
  build_strategy: proceduralization
  retrieve_strategy: query
  update_strategy: adjustment
  k_retrieve: 5
  max_keywords: 8
  confidence_threshold: 0.0
  memory_confidence: 100.0
  add_similarity_threshold: 0.9
  mos_config_path: configs/mos_config.json
  user_id: cross_bcb_exp
  sim_norm_mean: 0.31
  sim_norm_std: 0.10

environment:
  alfworld_config_path: configs/envs/alfworld.yaml
  alfworld_env_type: AlfredTWEnv

experiment:
  experiment_name: cross_bcb_train
  algorithm: rl
  val_before_train: false
  enable_value_driven: true
  random_seed: 42
  mode: train
  bcb_run_validation: false
  output_dir: ./results
  save_trajectories: true
  save_memories: true
  enable_logging: true
  log_level: INFO

rl_config:
  epsilon: 0.1
  tau: 0.35
  alpha: 0.3
  gamma: 0.0
  q_init_pos: 0.0
  q_init_neg: 0.0
  success_reward: 1.0
  failure_reward: -1.0
  sim_threshold: 0.5
  topk: 5
  novelty_threshold: 0.85
  recency_boost: 0.0
  reward_merge_gain: 0.1
  q_min_threshold: -0.8
  weight_sim: 0.5
  weight_q: 0.5
