# BCB pass@10 baseline: 10 independent attempts per task, no memory
# Cumulative SR = fraction solved in at least 1 of 10 tries
# Run with: --baseline_mode passk --baseline_k 10

llm:
  provider: "openai"
  api_key: "EMPTY"
  base_url: "http://localhost:8000/v1/"
  model: "deepseek-ai/DeepSeek-V3"
  temperature: 0.0
  max_tokens: 16384

embedding:
  provider: "openai"
  api_key: "EMPTY"
  base_url: "http://localhost:8001/v1/"
  model: "Qwen/Qwen3-Embedding-8B"
  dimension: 4096
  max_text_len: 8192

memory:
  build_strategy: "trajectory"
  retrieve_strategy: "avefact"
  update_strategy: "adjustment"
  k_retrieve: 0
  max_keywords: 5
  add_similarity_threshold: 0.9
  memory_budget_tokens: 0
  sim_norm_mean: 0.1856827586889267
  sim_norm_std: 0.09407906234264374

rl_config:
  alpha: 0.3
  gamma: 0.0
  lambda_: 0.5
  sim_threshold: 0.0
  tau: 0.0
  topk: 5

experiment:
  experiment_name: "bcb_passk10_local"
  output_dir: "/storage/openpsi/experiments/checkpoints/admin/yl-mem-region/bigcodebench"
  batch_size: 8
  enable_value_driven: false
  bcb_run_validation: false
  baseline_mode: "passk"
  baseline_k: 10
