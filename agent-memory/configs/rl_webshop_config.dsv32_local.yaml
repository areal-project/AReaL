# WebShop config for DeepSeek-V3.2 served locally via SGLang.
# LLM: deepseek/deepseek-v3.2 via SGLang on 8×H200 (TP=8, native DSA).
# Embedding: text-embedding-3-large via MatrixLLM API (dim=3072).
#
# V3.2 has thinking enabled by default in SGLang; --reasoning-parser deepseek-v3
# splits reasoning_content from final content. We keep WebShop's existing
# admissible-actions prompt; the model emits <action>...</action> at the end of
# its content.

llm:
  provider: "openai"
  api_key: "EMPTY"
  base_url: "http://localhost:30000/v1/"
  model: "deepseek/deepseek-v3.2"
  temperature: 1.0
  max_tokens: 8192

embedding:
  provider: "openai"
  api_key: "sk-43dd5f664179406d92fec42a9364f8a5"
  base_url: "https://matrixllm.alipay.com/v1/"
  model: "text-embedding-3-large"
  dimension: 3072
  max_text_len: 4096

memory:
  build_strategy: "proceduralization"
  retrieve_strategy: "query"
  update_strategy: "adjustment"
  k_retrieve: 5
  max_keywords: 5
  add_similarity_threshold: 0.9
  memory_budget_tokens: 0
  sim_norm_mean: 0.5
  sim_norm_std: 0.12

experiment:
  random_seed: 42
  enable_value_driven: true
  experiment_name: "webshop_dsv32_smoke"
  mode: "train"
  num_sections: 5
  batch_size: 16
  dataset_ratio: 1.0
  output_dir: "/storage/openpsi/experiments/checkpoints/admin/yl-mem-region"
  max_steps: 30
  save_trajectories: true
  save_memories: true
  valid_interval: 1
  test_interval: 1
  val_lambda_max: 0.05
  file_path: "data/webshop/items_shuffle_indist.json"
  ood_file_path: "data/webshop/items_shuffle_ood_new.json"
  split_info_path: "data/webshop/split_info_small.json"
  few_shot_path: "data/webshop/webshop_examples.json"

rl_config:
  epsilon: 0
  tau: 0.35
  alpha: 0.3
  gamma: 0.0
  q_init_pos: 0
  q_init_neg: 0
  success_reward: 1.0
  failure_reward: -1.0
  topk: 3
  novelty_threshold: 0.85
  recency_boost: 0.0
  reward_merge_gain: 0.1
  q_min_threshold: -10
  sim_threshold: 0.5
  weight_sim: 0.5
  weight_q: 0.5
