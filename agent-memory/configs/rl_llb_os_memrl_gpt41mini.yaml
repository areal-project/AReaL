# LLB OS Interaction - MemRL with claude-haiku-4-5
# Validation run for two improvements (both config-gated):
#   experiment.llb_reflection_prompt: v2  -> OS-specific reflection prompt
#   memory.script_detail_level: detailed  -> success memories keep concrete commands
# Compare vs prior gpt-4.1-mini flat curve (~69-70%) and nomem baseline (64.3%).

llm:
  provider: "openai"
  api_key: "sk-43dd5f664179406d92fec42a9364f8a5"
  base_url: "https://matrixllm.alipay.com/v1/"
  api_version: null
  model: "gpt-4.1-mini-2025-04-14"
  temperature: 0.0
  max_tokens: 10240

embedding:
  provider: "openai"
  api_key: "sk-43dd5f664179406d92fec42a9364f8a5"
  base_url: "https://matrixllm.alipay.com/v1/"
  api_version: null
  model: "text-embedding-3-large"
  dimension: 3072
  max_text_len: 8196

memory:
  build_strategy: "proceduralization"
  retrieve_strategy: "query"
  update_strategy: "adjustment"
  k_retrieve: 10
  max_keywords: 8
  confidence_threshold: 0.0
  memory_confidence: 100.0
  add_similarity_threshold: 0.99
  memory_budget_tokens: 0
  mos_config_path: "configs/mos_config.json"
  user_id: "llb_os_memrl_gpt41mini_user"
  load_from_checkpoint: false
  checkpoint_path: ""
  script_detail_level: "detailed"   # keep concrete commands in success memories
  sim_norm_mean: 0.39               # OS-specific normalization
  sim_norm_std: 0.14

environment:
  alfworld_config_path: "configs/envs/alfworld.yaml"
  alfworld_env_type: "AlfredTWEnv"

experiment:
  experiment_name: "llb_os_memrl_gpt41mini"
  trace_jsonl_path: null
  trace_sample_filter: null
  llb_use_z_score_normalization: true
  llb_q_floor: 0.0
  llb_dedup_by_task_id: false
  llb_reflection_prompt: "v2"   # OS-aware reflection prompt (env var still overrides)
  algorithm: "rl"
  val_before_train: false
  enable_value_driven: true
  random_seed: 42
  mode: "train"
  task: "os"
  split_file: "data/llb/os_interaction_train.json"
  valid_file: "data/llb/os_interaction_val.json"
  num_sections: 10
  batch_size: 5
  max_steps: 15
  valid_interval: 1
  test_interval: 1
  dataset_ratio: 1.0
  few_shot_path: "data/alfworld/alfworld_examples.json"
  bon: 0
  hle_categories: null
  hle_category_ratio: null
  ckpt_save_every_n_batches: 10   # mid-section snapshot every 10 mini-batches (for mid-section resume)
  ckpt_max_keep: 3                # keep latest 3 batch ckpts per in-progress section (safety margin vs deleting too eagerly); section-level ckpt (per epoch) always kept, and a section's batch ckpts are purged once its section ckpt is saved
  ckpt_eval_enabled: false
  ckpt_eval_path: null
  ckpt_resume_enabled: false
  ckpt_resume_path: null
  ckpt_resume_epoch: null
  baseline_mode: null
  baseline_k: 10
  output_dir: "/storage/openpsi/experiments/checkpoints/admin/yl-mem-region/llb_v2reflect"
  save_trajectories: true
  save_memories: true
  enable_logging: true
  log_level: "INFO"

rl_config:
  epsilon: 0.01
  tau: 0.35
  alpha: 0.3
  gamma: 0.0
  q_init_pos: 0.0
  q_init_neg: 0.0
  q_floor: null
  success_reward: 1.0
  failure_reward: 0.0
  sim_threshold: 0.50         # Paper: δ=0.50 for OS
  topk: 5
  novelty_threshold: 0.85
  recency_boost: 0.0
  reward_merge_gain: 0.1
  q_min_threshold: -0.8
  weight_sim: 0.5
  weight_q: 0.5
