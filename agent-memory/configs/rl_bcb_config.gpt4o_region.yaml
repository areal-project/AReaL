# BCB config for gpt-4o-2024-11-20 (API) + text-embedding-3-large (API) — REGION version.
# Control-variable experiment vs the V3+Qwen3-Embedding region run: does a stronger
# LLM (gpt-4o) + stronger embedding (text-embedding-3-large) make region/memory help more?
# gpt-4o on MatrixLLM does NOT trigger the 428 content filter (unlike deepseek-v3), and
# text-embedding-3-large embeddings rarely 428. No local GPU needed — both via API.

llm:
  provider: "openai"
  api_key: "sk-43dd5f664179406d92fec42a9364f8a5"
  base_url: "https://matrixllm.alipay.com/v1/"
  model: "gpt-4o-2024-11-20"
  temperature: 0.0
  max_tokens: 16384

embedding:
  provider: "openai"
  api_key: "sk-43dd5f664179406d92fec42a9364f8a5"
  base_url: "https://matrixllm.alipay.com/v1/"
  model: "text-embedding-3-large"
  dimension: 3072
  max_text_len: 8196

memory:
  build_strategy: "proceduralization"
  retrieve_strategy: "avefact"
  update_strategy: "adjustment"
  k_retrieve: 10
  max_keywords: 5
  add_similarity_threshold: 0.9
  memory_budget_tokens: 0
  sim_norm_mean: 0.1856827586889267
  sim_norm_std: 0.09407906234264374

rl_config:
  alpha: 0.3
  gamma: 0.0
  lambda_: 0.5
  sim_threshold: 0.18
  tau: 0.18
  topk: 5

experiment:
  experiment_name: "bcb_gpt4o_region"
  output_dir: "/storage/openpsi/experiments/checkpoints/admin/yl-mem-region/bigcodebench"
  batch_size: 8
  enable_value_driven: true
  bcb_run_validation: true
