# ALFWorld NO-MEMORY eval config for Qwen2.5-72B-Instruct.
# k_retrieve=0 → retrieve_query returns empty list, agent runs cold (no memory injected).
# mode=test → skip training, only run eval on valid (in_distribution) + test (out_of_distribution).
# Purpose: fill the missing Qwen2.5-72B no-mem datapoint as a sanity reference
# for the MemRL-with-memory baseline 927704 (S2 cum 56.54%) and region 927808.

llm:
  provider: "openai"
  api_key: "EMPTY"
  base_url: "http://localhost:8000/v1/"
  model: "Qwen2.5-72B-Instruct"
  temperature: 0
  max_tokens: 4096

embedding:
  provider: "openai"
  api_key: "EMPTY"
  base_url: "http://localhost:8001/v1/"
  model: "Qwen/Qwen3-Embedding-8B"
  max_text_len: 8196

memory:
  build_strategy: "proceduralization"
  retrieve_strategy: "query"
  update_strategy: "adjustment"
  k_retrieve: 0           # NO-MEM: skip retrieval, agent gets no memories
  max_keywords: 5
  add_similarity_threshold: 0.9
  memory_budget_tokens: 0
  sim_norm_mean: 0.5187
  sim_norm_std: 0.1203

environment:
  alfworld_config_path: "configs/envs/alfworld.yaml"
  alfworld_env_type: "AlfredTWEnv"

experiment:
  random_seed: 42
  enable_value_driven: false
  experiment_name: "alfworld_nomem_qwen72b_eval"
  mode: "test"            # eval-only: skip training, run eval on valid + test
  num_sections: 1
  batch_size: 32
  dataset_ratio: 1.0
  few_shot_path: "data/alfworld/alfworld_examples.json"
  baseline_mode: null
  baseline_k: 10
  output_dir: "/storage/openpsi/experiments/checkpoints/admin/yl-mem-region"
  max_steps: 30
  save_trajectories: true
  save_memories: false
  bon: 0
  valid_interval: 2
  test_interval: 2

rl_config:
  epsilon: 0
  tau: 0.62
  alpha: 0.3
  gamma: 0.0
  q_init_pos: 0
  q_init_neg: 0
  success_reward: 1.0
  failure_reward: -1.0
  topk: 3
  novelty_threshold: 0.85
  recency_boost: 0.0
  reward_merge_gain: 0.1
  q_min_threshold: -10
  weight_sim: 0.5
  weight_q: 0.5
