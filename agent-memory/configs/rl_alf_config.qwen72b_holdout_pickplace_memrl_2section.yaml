# ALFWorld holdout config for Qwen2.5-72B-Instruct, plain MemRL (NO region).
# This is the MemRL CONTROL for the region+transfer holdout 927950.
# Matched setup except: no --region flag → uses base MemoryService instead of
# RegionMemoryService. So no region clustering, no transfer formula, no
# shrinkage_confidence_k / propagation_eta / val_lambda_max effects.
#
# Single-bank zero-shot holdout: train on 6 subtasks excluding the held-out
# one, then eval on the held-out subtask at each section checkpoint.
#
# Choice of holdout: pick_and_place_simple (same as region run for direct compare)
#   - sample size 825 games (train=790, valid=35) for tight error bars
#
# Hyperparameters identical to rl_alf_config.qwen72b_holdout_pickplace_2section.yaml
# (the region+transfer config), only experiment_name differs.

llm:
  provider: "openai"
  api_key: "EMPTY"
  base_url: "http://localhost:8000/v1/"
  model: "Qwen2.5-72B-Instruct"
  temperature: 0
  max_tokens: 4096

embedding:
  provider: "openai"
  api_key: "EMPTY"
  base_url: "http://localhost:8001/v1/"
  model: "Qwen/Qwen3-Embedding-8B"
  max_text_len: 8196

memory:
  build_strategy: "proceduralization"
  retrieve_strategy: "query"
  update_strategy: "adjustment"
  k_retrieve: 5
  max_keywords: 5
  add_similarity_threshold: 0.9
  memory_budget_tokens: 0
  sim_norm_mean: 0.5187
  sim_norm_std: 0.1203

environment:
  alfworld_config_path: "configs/envs/alfworld.yaml"
  alfworld_env_type: "AlfredTWEnv"

experiment:
  random_seed: 42
  enable_value_driven: true
  experiment_name: "alfworld_holdout_pick_and_place_simple_qwen72b_memrl_2section"
  mode: "train"
  num_sections: 2
  batch_size: 32
  dataset_ratio: 1.0
  few_shot_path: "data/alfworld/alfworld_examples.json"
  baseline_mode: null
  baseline_k: 10
  output_dir: "/storage/openpsi/experiments/checkpoints/admin/yl-mem-region"
  max_steps: 30
  save_trajectories: true
  save_memories: true
  bon: 0
  valid_interval: 1
  test_interval: 1
  # Single-bank zero-shot holdout. Excludes this subtask's games from train and
  # memory pool; holdout eval bucket = held-out games from valid+test (~750).
  # Also overridable via --holdout_subtask CLI flag.
  holdout_subtask: "alf/pick_and_place_simple"
  # No val_lambda_max: MemRL has no region_manager, this is a no-op anyway.
  # Removed to keep this config visibly free of region-specific knobs.
  val_lambda_max: null

rl_config:
  epsilon: 0
  tau: 0.62
  alpha: 0.3
  gamma: 0.0
  q_init_pos: 0
  q_init_neg: 0
  success_reward: 1.0
  failure_reward: -1.0
  topk: 3
  novelty_threshold: 0.85
  recency_boost: 0.0
  reward_merge_gain: 0.1
  q_min_threshold: -10
  weight_sim: 0.5
  weight_q: 0.5
