# v10 ALFWorld holdout config — Arm S (Sim*D1).
# See docs/ALFWORLD_V10_HOLDOUT_IMPL.md
#
# Mode: sim_d1
#   - All top-5 chosen from sim*D1 with pool=500
#   - sim is the candidate filter, D1 is the rerank weight
# Control arm: tests whether sim signal still adds value when combined with D1.
#
# Offline validation: mean Q@5 = 0.627 (better than sim-only 0.549 by +7.8pp,
# but worse than Pure-D1 0.880 — suggests sim drags D1 down).

llm:
  provider: "openai"
  api_key: "EMPTY"
  base_url: "http://localhost:8000/v1/"
  model: "Qwen2.5-72B-Instruct"
  temperature: 0
  max_tokens: 4096

embedding:
  provider: "openai"
  api_key: "EMPTY"
  base_url: "http://localhost:8001/v1/"
  model: "Qwen/Qwen3-Embedding-8B"
  max_text_len: 8196

memory:
  build_strategy: "proceduralization"
  retrieve_strategy: "query"
  update_strategy: "adjustment"
  k_retrieve: 5
  max_keywords: 5
  add_similarity_threshold: 0.9
  memory_budget_tokens: 0
  sim_norm_mean: 0.5187
  sim_norm_std: 0.1203

environment:
  alfworld_config_path: "configs/envs/alfworld.yaml"
  alfworld_env_type: "AlfredTWEnv"

experiment:
  random_seed: 42
  enable_value_driven: true
  experiment_name: "alfworld_holdout_pickplace_v10_sim_d1_qwen72b_2section"
  mode: "train"
  num_sections: 2
  batch_size: 32
  dataset_ratio: 1.0
  few_shot_path: "data/alfworld/alfworld_examples.json"
  baseline_mode: null
  baseline_k: 10
  output_dir: "/storage/openpsi/experiments/checkpoints/admin/yl-mem-region"
  max_steps: 30
  save_trajectories: true
  save_memories: true
  bon: 0
  valid_interval: 1
  test_interval: 1
  holdout_subtask: "alf/pick_and_place_simple"
  val_lambda_max: null
  # v10 sim_d1: all 5 chosen by sim*D1 from pool of 500.
  holdout_retrieval_mode: "sim_d1"
  holdout_pool_size: 500
  holdout_d1_anchors: 0

rl_config:
  epsilon: 0
  tau: 0.62
  alpha: 0.3
  gamma: 0.0
  q_init_pos: 0
  q_init_neg: 0
  success_reward: 1.0
  failure_reward: -1.0
  topk: 3
  novelty_threshold: 0.85
  recency_boost: 0.0
  reward_merge_gain: 0.1
  q_min_threshold: -10
  weight_sim: 0.5
  weight_q: 0.5
