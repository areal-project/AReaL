# ALFWorld region config for Qwen2.5-72B-Instruct, FULL 10-section RERUN.
# batch_size=64 (doubled from paper's 32) to accelerate training.
# Ports configured for combined job: LLM=8300, Embed=8401.
#
# Paper flags (must pass at CLI):
#   --region --region_gating_mode additive
#   --shrinkage_confidence_k 3.0 --propagation_eta 0.12
#   --val_lambda_max 0.05 --no_z_norm
#   --explore_schedule "0,2,2,1,1,1,1,0,0,0"
#   --failure_summary_n_slots 2 --skip_initial_eval

llm:
  provider: "openai"
  api_key: "EMPTY"
  base_url: "http://localhost:8300/v1/"
  model: "Qwen2.5-72B-Instruct"
  temperature: 0
  max_tokens: 4096

embedding:
  provider: "openai"
  api_key: "EMPTY"
  base_url: "http://localhost:8401/v1/"
  model: "Qwen/Qwen3-Embedding-8B"
  max_text_len: 8196

memory:
  build_strategy: "proceduralization"
  retrieve_strategy: "query"
  update_strategy: "adjustment"
  k_retrieve: 5
  max_keywords: 5
  add_similarity_threshold: 0.9
  memory_budget_tokens: 0
  sim_norm_mean: 0.5187
  sim_norm_std: 0.1203

environment:
  alfworld_config_path: "configs/envs/alfworld.yaml"
  alfworld_env_type: "AlfredTWEnv"

experiment:
  random_seed: 42
  enable_value_driven: true
  experiment_name: "alfworld_region_qwen72b_10section_nozn_bs64_rerun"
  mode: "train"
  num_sections: 10
  batch_size: 64
  dataset_ratio: 1.0
  few_shot_path: "data/alfworld/alfworld_examples.json"
  baseline_mode: null
  baseline_k: 10
  output_dir: "/storage/openpsi/experiments/checkpoints/admin/yl-mem-region"
  max_steps: 30
  save_trajectories: true
  save_memories: true
  bon: 0
  valid_interval: 2
  test_interval: 2
  val_lambda_max: 0.05

rl_config:
  epsilon: 0
  tau: 0.62
  alpha: 0.3
  gamma: 0.0
  q_init_pos: 0
  q_init_neg: 0
  success_reward: 1.0
  failure_reward: -1.0
  topk: 3
  novelty_threshold: 0.85
  recency_boost: 0.0
  reward_merge_gain: 0.1
  q_min_threshold: -10
  weight_sim: 0.5
  weight_q: 0.5
