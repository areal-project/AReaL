# Qwen3.8-27B GRPO: 8 actor GPUs and 8 rollout GPUs on separate nodes.
experiment_name: pixel-reasoner-grpo
trial_name: trial1

seed: 1
# Shared bundle root; use disjoint labelled JSONL manifests for train/validation.
data_root: ???
max_turns: null
max_output_tokens: null
original_max_pixels: 1568000
crop_max_pixels: 784000
enable_offload: false
total_train_epochs: 1
tokenizer_path: ${actor.path}

cluster:
  # Slurm assigns one complete 8-GPU node to each role.
  n_nodes: 2
  n_gpus_per_node: 8
  fileroot: ???
  name_resolve:
    type: nfs
    nfs_record_root: ${cluster.fileroot}/name_resolve

scheduler:
  type: slurm

rollout:
  backend: "sglang:d2p1t4"
  _version: v1
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  max_concurrent_rollouts: 4
  queue_size: null
  consumer_batch_size: ${train_dataset.batch_size}
  max_head_offpolicyness: 0
  enable_rollout_tracing: false
  scheduling_spec: ${actor.scheduling_spec}
  fileroot: ${cluster.fileroot}
  tokenizer_path: ${tokenizer_path}
  dump_to_file: true

gconfig:
  n_samples: 4
  min_new_tokens: 0
  max_new_tokens: 32768
  max_tokens: 262144
  skip_special_tokens: false
  greedy: false
  temperature: 1.0

actor:
  backend: "megatron:d1p1t8"
  _version: v1
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  # Local Qwen3.8-27B checkpoint (HF architecture: qwen3_5).
  path: ???
  init_from_scratch: false
  disable_dropout: true
  gradient_checkpointing: true
  dtype: bfloat16
  weight_update_mode: disk
  megatron:
    bridge_type: megatron-bridge
    use_bridge_for_update_weights: true
    enable_mtp: false
  mb_spec:
    # One complete training batch, without token-based microbatch splitting.
    n_mbs: 1
    granularity: 1
    max_tokens_per_mb: null
  optimizer:
    type: adam
    lr: 1e-6
    weight_decay: 0.01
    beta1: 0.9
    beta2: 0.999
    eps: 1e-8
    lr_scheduler_type: constant
    gradient_clipping: 1.0
    warmup_steps_proportion: 0.001
    warmup_steps: 0
  eps_clip: 0.4
  temperature: ${gconfig.temperature}
  reward_scaling: 10.0
  reward_bias: -0.5
  kl_ctl: 0.0
  ppo_n_minibatches: 1
  recompute_logprob: true
  use_decoupled_loss: true
  rejection_sampling:
    metric: ratio
    upper: 5.0
  reward_norm:
    mean_level: group
    std_level: group
    group_size: ${gconfig.n_samples}
  adv_norm:
    mean_level: batch
    std_level: batch
  max_new_tokens: ${gconfig.max_new_tokens}
  scheduling_spec:
    - gpu: 1
      cpu: 8
      mem: 32
      env_vars:
        PYTORCH_ALLOC_CONF: "expandable_segments:True"
        NCCL_CUMEM_ENABLE: "0"
        NCCL_NVLS_ENABLE: "0"

ref: null

eval_gconfig:
  n_samples: 1
  temperature: 0.6
  max_new_tokens: ${gconfig.max_new_tokens}
  max_tokens: ${gconfig.max_tokens}
  skip_special_tokens: false

sglang:
  model_path: ${actor.path}
  random_seed: ${seed}
  skip_tokenizer_init: false
  dtype: ${actor.dtype}
  max_running_requests: 4
  context_length: ${gconfig.max_tokens}
  mem_fraction_static: 0.7
  enable_multimodal: true
  disable_custom_all_reduce: true
  disable_cuda_graph: true

train_dataset:
  batch_size: 2
  shuffle: true
  pin_memory: true
  num_workers: 0
  path: ???
  type: rl
  scheduling_spec: null

valid_dataset:
  shuffle: false
  drop_last: false
  batch_size: 2
  pin_memory: true
  num_workers: 0
  path: ???
  type: rl
  scheduling_spec: null

saver:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 1
  freq_steps: null
  freq_secs: null

recover:
  mode: disabled
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 1
  freq_steps: null
  freq_secs: 3600

evaluator:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 1
  freq_steps: null
  freq_secs: null

stats_logger:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  wandb:
    mode: disabled

perf_tracer:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  enabled: false
  session_tracer:
    enabled: false
