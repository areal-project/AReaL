experiment_name: pixel-reasoner
trial_name: trial1
seed: 1
# Override with a locally available 27B checkpoint and compatible processor.
tokenizer_path: ???
allocation_mode: sglang:d4t2
recover:
  mode: disabled
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
cluster:
  n_nodes: 1
  n_gpus_per_node: 8
  fileroot: /tmp/areal/experiments
  name_resolve:
    type: nfs
    nfs_record_root: /tmp/areal/name_resolve

# A bundle containing manifest.jsonl and image paths relative to data_root.
data_root: ???
manifest: manifest.jsonl
dump_dir: /tmp/areal/pixel-traces
limit: 32
max_turns: null
max_output_tokens: 262144
original_max_pixels: 1568000
crop_max_pixels: 784000
# null starts at the rollout ceiling. The optional control JSON can lower/raise
# the total in-flight target during a run, up to that prepared ceiling.
initial_concurrency: null
concurrency_control: null

rollout:
  backend: sglang:d4t2
  tokenizer_path: ${tokenizer_path}
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  # Hard ceiling for total concurrent episodes across all replicas, not per DP.
  max_concurrent_rollouts: 64
  consumer_batch_size: 1
  max_head_offpolicyness: 1000000000000
  setup_timeout: 1800
  request_timeout: 3600

gconfig:
  n_samples: 1
  temperature: 0.6
  top_p: 0.95
  max_new_tokens: 32768
  max_tokens: 262144
  skip_special_tokens: false

sglang:
  model_path: ${tokenizer_path}
  random_seed: ${seed}
  skip_tokenizer_init: false
  enable_multimodal: true
  context_length: ${gconfig.max_tokens}
  mem_fraction_static: 0.8
  max_running_requests: 64
  chunked_prefill_size: 8192

stats_logger:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  wandb:
    mode: disabled
