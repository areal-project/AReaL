# Qwen3.5-2B VLM GRPO on Geometry3K: Megatron-Bridge + SGLang + AWEX.
# Adapted from examples/vlm/qwen3_5_2b_megatron_geometry3k_grpo.yaml.
# MODEL_PATH is a complete BF16 VLM; FP8_MODEL_PATH is its converted rollout copy.
experiment_name: qwen3-5-2b-fp8-geometry3k-grpo
trial_name: ${oc.env:TRIAL_NAME,trial1}

seed: 1
enable_offload: false
total_train_epochs: 15
total_train_steps: null
tokenizer_path: ${actor.path}

cluster:
  n_nodes: 1
  n_gpus_per_node: 8
  fileroot: ${oc.env:FILEROOT}
  name_resolve:
    type: nfs
    nfs_record_root: ${cluster.fileroot}/name_resolve

scheduler:
  type: local

rollout:
  # Four inference GPUs, separate from the four training GPUs.
  backend: "sglang:d1t4p1"
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  max_concurrent_rollouts: 64
  queue_size: null
  consumer_batch_size: ${train_dataset.batch_size}
  max_head_offpolicyness: 1
  enable_rollout_tracing: false
  scheduling_strategy:
    type: separation
  scheduling_spec: ${actor.scheduling_spec}
  fileroot: ${cluster.fileroot}
  tokenizer_path: ${tokenizer_path}
  dump_to_file: true

gconfig:
  n_samples: 4
  min_new_tokens: 0
  max_new_tokens: 2048
  max_tokens: 4096
  greedy: false
  temperature: 1.0

actor:
  backend: "megatron:d2p1t2"
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: ${oc.env:MODEL_PATH}
  init_from_scratch: false
  disable_dropout: true
  gradient_checkpointing: true
  dtype: bfloat16
  mb_spec:
    max_tokens_per_mb: 4096
  optimizer:
    type: adam
    lr: 5e-7
    weight_decay: 0.01
    beta1: 0.9
    beta2: 0.999
    eps: 1e-8
    lr_scheduler_type: constant
    gradient_clipping: 1.0
    warmup_steps_proportion: 0.001
  eps_clip: 0.4
  temperature: ${gconfig.temperature}
  reward_scaling: 10.0
  reward_bias: -0.5
  kl_ctl: 0.0
  ppo_n_minibatches: 1
  recompute_logprob: true
  use_decoupled_loss: true
  prox_logp_method: recompute
  rejection_sampling:
    level: token
    action: mask
    metric: binary_kl
    # Initial KPop threshold from gsm8k_kpop; not tuned for Qwen3.5 FP8.
    upper: 2.0
    lower: null
  reward_norm:
    mean_level: group
    std_level: group
    group_size: ${gconfig.n_samples}
  adv_norm:
    mean_level: batch
    std_level: batch
  weight_update_mode: awex
  megatron:
    bridge_type: megatron-bridge
    enable_mtp: false
    fp8_config:
      mode: e4m3
      recipe: blockwise
      param: false
      direct_convert: false
    ddp:
      fp8_param_gather: false
  max_new_tokens: ${gconfig.max_new_tokens}
  scheduling_spec:
    - task_type: worker
      port_count: 2
      gpu: 1
      mem: 32
      cmd: python3 -m areal.infra.rpc.rpc_server
      env_vars:
        NVTE_FP8_BLOCK_SCALING_FP32_SCALES: "1"
        TMS_INIT_ENABLE: "0"
        TMS_INIT_ENABLE_CPU_BACKUP: "0"

ref:
  backend: ${actor.backend}
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: ${actor.path}
  init_from_scratch: false
  disable_dropout: true
  dtype: ${actor.dtype}
  mb_spec:
    max_tokens_per_mb: 4096
  optimizer: null
  megatron:
    bridge_type: megatron-bridge
    enable_mtp: false
  scheduling_strategy:
    type: colocation
    target: actor
  scheduling_spec: ${actor.scheduling_spec}

sglang:
  model_path: ${oc.env:FP8_MODEL_PATH}
  random_seed: ${seed}
  skip_tokenizer_init: true
  dtype: ${actor.dtype}
  fp8_gemm_runner_backend: triton
  max_running_requests: 64
  context_length: 32768
  mem_fraction_static: 0.8
  enable_multimodal: true
  disable_cuda_graph: true
  mamba_ssm_dtype: bfloat16

# Image tokens count toward the prompt limit, leaving 2048 tokens for generation.
train_dataset:
  batch_size: 64
  shuffle: true
  pin_memory: true
  num_workers: 4
  path: hiyouga/geometry3k
  type: rl
  max_length: 2048

valid_dataset:
  batch_size: 64
  pin_memory: true
  num_workers: 4
  path: hiyouga/geometry3k
  type: rl
  max_length: 2048

saver:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 1
  freq_steps: null
  freq_secs: null

recover:
  mode: disabled
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 1
  freq_steps: null
  freq_secs: 3600

evaluator:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 1
  freq_steps: null
  freq_secs: null

stats_logger:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  wandb:
    mode: disabled

perf_tracer:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  enabled: false
  session_tracer:
    enabled: false
