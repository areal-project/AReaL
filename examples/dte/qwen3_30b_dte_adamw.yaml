defaults:
  - ../math/gsm8k_grpo_megatron@_global_
  - _self_

experiment_name: pyq-areal-port-dte-qwen3-30b
trial_name: trial0
seed: 42
enable_offload: true
total_train_steps: 3
tokenizer_path: ${actor.path}

cluster:
  n_nodes: 1
  n_gpus_per_node: 8
  fileroot: /storage/openpsi/users/pengzai.pyq/areal_port_dte_qwen3_30b/fileroot
  name_resolve:
    type: nfs
    nfs_record_root: ${cluster.fileroot}/name_resolve/${experiment_name}/${trial_name}

scheduler:
  type: local

gconfig:
  n_samples: 2
  min_new_tokens: 0
  max_new_tokens: 2048
  max_tokens: 3072
  greedy: false
  temperature: 1.0
  top_p: 1.0
  top_k: 1000000

rollout:
  _version: v2
  backend: "sglang:d2t4p1"
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  setup_timeout: 43200
  request_timeout: 7200
  workers_ready_timeout: 43200
  pause_grace_period: 30
  max_concurrent_rollouts: 64
  queue_size: null
  consumer_batch_size: ${train_dataset.batch_size}
  max_head_offpolicyness: 8
  enable_rollout_tracing: false
  scheduling_spec: ${actor.scheduling_spec}
  scheduling_strategy:
    type: colocation
    target: actor
    fork: true
  fileroot: ${cluster.fileroot}
  tokenizer_path: ${tokenizer_path}
  dump_to_file: true
  agent:
    mode: inline
    export_style: individual
    turn_discount: 1.0

actor:
  _version: v2
  backend: "megatron:(attn:d2p1t4|ffn:d1p1e8)"
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: /storage/openpsi/models/Qwen__Qwen3-30B-A3B
  offload: true
  init_from_scratch: false
  disable_dropout: true
  gradient_checkpointing: true
  dtype: bfloat16
  grad_reduce_dtype: float32
  mb_spec:
    n_mbs: 1
    granularity: 1
    max_tokens_per_mb: 6144
    n_mbs_divisor: 1
  optimizer:
    type: adam
    lr: 3e-6
    weight_decay: 0.003
    beta1: 0.9
    beta2: 0.999
    eps: 1e-8
    lr_scheduler_type: constant
    gradient_clipping: 1.0
    warmup_steps_proportion: 0
  megatron:
    wrap_with_ddp: true
    ddp:
      grad_reduce_in_fp32: true
      overlap_grad_reduce: true
      overlap_param_gather: false
      use_distributed_optimizer: true
    use_deterministic_algorithms: true
    enable_fp32_lm_head: true
    cross_entropy_loss_fusion: false
    recompute_granularity: full
    recompute_method: uniform
    recompute_num_layers: 1
    moe_router_dtype: fp32
    moe_token_dispatcher_type: alltoall
    moe_router_bias_update_rate: 0.0
  eps_clip: 0.4
  eps_clip_higher: null
  temperature: ${gconfig.temperature}
  reward_scaling: 10.0
  reward_bias: -0.5
  kl_ctl: 0.0
  ppo_n_minibatches: 1
  recompute_logprob: false
  prox_logp_method: reuse_train_logp
  use_decoupled_loss: true
  rejection_sampling:
    level: token
    action: mask
    metric: ratio
    upper: 5.0
  reward_norm:
    mean_level: group
    std_level: group
    group_size: ${gconfig.n_samples}
  adv_norm:
    mean_level: batch
    std_level: batch
  weight_update_mode: awex
  max_new_tokens: ${gconfig.max_new_tokens}
  dte:
    enabled: true
    transfer: delta
    delta_method: adamw
    anchor_interval: 0
    verify_snapshot: false
    release_train_weights_after_update: true
    release_initial_rollout_weights: false
    sync_model_params_before_payload: true
  scheduling_spec:
    - task_type: worker
      port_count: 2
      gpu: 1
      cpu: 4
      mem: 64
      image: ${oc.env:IMAGE,"/storage/openpsi/images/areal-dev-20260508.sif"}
      nodelist: ""
      exclude: ""
      cmd: python3 -m areal.infra.rpc.rpc_server
      env_vars:
        DTE_SRC: ${oc.env:DTE_SRC,"/storage/openpsi/users/pengzai.pyq/delta-transfer-engine-pyq-perf-sparse-p2p/src"}
        DTE_AWEX_SRC: ${oc.env:DTE_AWEX_SRC,"/storage/openpsi/users/pengzai.pyq/asystem-awex"}
        PYTHONPATH: ${oc.env:DTE_SRC,"/storage/openpsi/users/pengzai.pyq/delta-transfer-engine-pyq-perf-sparse-p2p/src"}:${oc.env:DTE_AWEX_SRC,"/storage/openpsi/users/pengzai.pyq/asystem-awex"}:${oc.env:AREAL_SRC,"/storage/openpsi/users/pengzai.pyq/github_areal/AReaL"}
        AREAL_CACHE_DIR: ${oc.env:DTE_WORKER_CACHE_ROOT,"/tmp/dte-pyq-local/areal_worker_cache/qwen3_30b"}/areal/${oc.env:DTE_WORKER_CACHE_SUFFIX,"node"}
        AREAL_GUARD_PORT_REGISTRY: ${oc.env:DTE_WORKER_TMPDIR,"/tmp/dte-pyq-local"}/guard_ports/${oc.env:DTE_WORKER_CACHE_SUFFIX,"node"}.json
        HOME: ${oc.env:DTE_WORKER_CACHE_ROOT,"/tmp/dte-pyq-local/areal_worker_cache/qwen3_30b"}/home
        HF_HOME: ${oc.env:DTE_WORKER_CACHE_ROOT,"/tmp/dte-pyq-local/areal_worker_cache/qwen3_30b"}/hf
        HF_DATASETS_CACHE: ${oc.env:DTE_WORKER_CACHE_ROOT,"/tmp/dte-pyq-local/areal_worker_cache/qwen3_30b"}/hf/datasets
        TRANSFORMERS_CACHE: ${oc.env:DTE_WORKER_CACHE_ROOT,"/tmp/dte-pyq-local/areal_worker_cache/qwen3_30b"}/hf/transformers
        XDG_CACHE_HOME: ${oc.env:DTE_WORKER_CACHE_ROOT,"/tmp/dte-pyq-local/areal_worker_cache/qwen3_30b"}/xdg
        FLASHINFER_WORKSPACE_BASE: ${oc.env:DTE_WORKER_CACHE_ROOT,"/tmp/dte-pyq-local/areal_worker_cache/qwen3_30b"}/jit/${oc.env:DTE_IMAGE_CACHE_TAG,"areal-dev-20260508"}/flashinfer_base/${oc.env:DTE_WORKER_CACHE_SUFFIX,"node"}
        FLASHINFER_WORKSPACE_DIR: ${oc.env:DTE_WORKER_CACHE_ROOT,"/tmp/dte-pyq-local/areal_worker_cache/qwen3_30b"}/jit/${oc.env:DTE_IMAGE_CACHE_TAG,"areal-dev-20260508"}/flashinfer/${oc.env:DTE_WORKER_CACHE_SUFFIX,"node"}
        CUTE_DSL_CACHE_DIR: ${oc.env:DTE_WORKER_CACHE_ROOT,"/tmp/dte-pyq-local/areal_worker_cache/qwen3_30b"}/jit/${oc.env:DTE_IMAGE_CACHE_TAG,"areal-dev-20260508"}/cutlass/${oc.env:DTE_WORKER_CACHE_SUFFIX,"node"}
        TRITON_CACHE_DIR: ${oc.env:DTE_WORKER_CACHE_ROOT,"/tmp/dte-pyq-local/areal_worker_cache/qwen3_30b"}/jit/${oc.env:DTE_IMAGE_CACHE_TAG,"areal-dev-20260508"}/triton/${oc.env:DTE_WORKER_CACHE_SUFFIX,"node"}
        TRITON_CACHE_PATH: ${oc.env:DTE_WORKER_CACHE_ROOT,"/tmp/dte-pyq-local/areal_worker_cache/qwen3_30b"}/jit/${oc.env:DTE_IMAGE_CACHE_TAG,"areal-dev-20260508"}/triton_path/${oc.env:DTE_WORKER_CACHE_SUFFIX,"node"}
        PYTORCH_KERNEL_CACHE_PATH: ${oc.env:DTE_WORKER_CACHE_ROOT,"/tmp/dte-pyq-local/areal_worker_cache/qwen3_30b"}/jit/${oc.env:DTE_IMAGE_CACHE_TAG,"areal-dev-20260508"}/torch_kernel/${oc.env:DTE_WORKER_CACHE_SUFFIX,"node"}
        TORCHINDUCTOR_CACHE_DIR: ${oc.env:DTE_WORKER_CACHE_ROOT,"/tmp/dte-pyq-local/areal_worker_cache/qwen3_30b"}/jit/${oc.env:DTE_IMAGE_CACHE_TAG,"areal-dev-20260508"}/torchinductor/${oc.env:DTE_WORKER_CACHE_SUFFIX,"node"}
        TORCH_EXTENSIONS_DIR: ${oc.env:DTE_WORKER_CACHE_ROOT,"/tmp/dte-pyq-local/areal_worker_cache/qwen3_30b"}/jit/${oc.env:DTE_IMAGE_CACHE_TAG,"areal-dev-20260508"}/torch_extensions/${oc.env:DTE_WORKER_CACHE_SUFFIX,"node"}
        TVM_FFI_CACHE_DIR: ${oc.env:DTE_WORKER_CACHE_ROOT,"/tmp/dte-pyq-local/areal_worker_cache/qwen3_30b"}/jit/${oc.env:DTE_IMAGE_CACHE_TAG,"areal-dev-20260508"}/tvm_ffi/${oc.env:DTE_WORKER_CACHE_SUFFIX,"node"}
        VLLM_CACHE_ROOT: ${oc.env:DTE_WORKER_CACHE_ROOT,"/tmp/dte-pyq-local/areal_worker_cache/qwen3_30b"}/jit/${oc.env:DTE_IMAGE_CACHE_TAG,"areal-dev-20260508"}/vllm/${oc.env:DTE_WORKER_CACHE_SUFFIX,"node"}
        SGLANG_DG_CACHE_DIR: ${oc.env:DTE_WORKER_CACHE_ROOT,"/tmp/dte-pyq-local/areal_worker_cache/qwen3_30b"}/jit/${oc.env:DTE_IMAGE_CACHE_TAG,"areal-dev-20260508"}/deep_gemm/${oc.env:DTE_WORKER_CACHE_SUFFIX,"node"}
        NCCL_CUMEM_ENABLE: "0"
        NCCL_NVLS_ENABLE: "0"
        NCCL_IB_DISABLE: "0"
        NCCL_NET: IB
        NCCL_IB_HCA: mlx5
        NCCL_IB_GID_INDEX: "3"
        NCCL_IB_TC: "136"
        NCCL_IB_SL: "5"
        NCCL_IB_TIMEOUT: "22"
        NCCL_IB_RETRY_CNT: "7"
        NCCL_IB_QPS_PER_CONNECTION: "8"
        NCCL_SOCKET_IFNAME: "^lo"
        NCCL_P2P_PXN_LEVEL: "0"
        AWEX_WU_USE_GROUP: ${oc.env:AWEX_WU_USE_GROUP,"0"}
        DTE_DELTA_P2P_COALESCE: ${oc.env:DTE_DELTA_P2P_COALESCE,"1"}

ref:
  backend: ${actor.backend}
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: ${actor.path}
  init_from_scratch: false
  disable_dropout: true
  dtype: ${actor.dtype}
  mb_spec:
    max_tokens_per_mb: ${actor.mb_spec.max_tokens_per_mb}
  optimizer: null
  scheduling_strategy:
    type: colocation
    target: actor
  scheduling_spec: ${actor.scheduling_spec}

sglang:
  model_path: ${actor.path}
  random_seed: ${seed}
  skip_tokenizer_init: true
  dtype: ${actor.dtype}
  context_length: 32768
  mem_fraction_static: 0.65
  cuda_graph_max_bs: 16
  disable_custom_all_reduce: true

train_dataset:
  batch_size: 8
  path: /storage/openpsi/data/gsm8k

valid_dataset:
  batch_size: 8
  path: /storage/openpsi/data/gsm8k

saver:
  mode: auto
  freq_epochs: null
  freq_steps: null
  freq_secs: null

recover:
  mode: disabled
  freq_epochs: null
  freq_steps: null
  freq_secs: null

evaluator:
  freq_epochs: null
  freq_steps: null
  freq_secs: null

stats_logger:
  wandb:
    mode: disabled
