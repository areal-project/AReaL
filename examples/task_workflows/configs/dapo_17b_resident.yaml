# SPDX-License-Identifier: Apache-2.0
# Qwen3-1.7B shared 64K/nonthinking model bundle; 1000 questions x 5 passes.
defaults:
  - dapo
  - _self_

experiment_name: hermes-math
trial_name: qwen3-17b-train-1000x5-run1
total_train_epochs: 5
total_train_steps: 125

actor:
  optimizer:
    lr: 1e-6

elastic:
  enabled: false
  state_root: ${cluster.fileroot}/state
  checkpoint_estimated_bytes: 0

rollout:
  backend: "sglang:d4"
  max_concurrent_rollouts: 32
  agent:
    reasoning_parser: ""
    engine_max_tokens: 65536

sglang:
  dp_size: 1
  mem_fraction_static: 0.5

train_dataset:
  batch_size: 40

saver:
  freq_steps: 25
