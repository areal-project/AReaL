# SPDX-License-Identifier: Apache-2.0
# Task workflows: FSDP4 + SGLang1 in an 8-GPU allocation; 16 episodes / 4 updates.
experiment_name: task-workflows
trial_name: trial0

seed: 1
enable_offload: false
total_train_epochs: 1
total_train_steps: 4
tokenizer_path: ${actor.path}

cluster:
  n_nodes: 1
  n_gpus_per_node: 8
  fileroot: ${oc.env:AREAL_TASK_RUN_ROOT}
  name_resolve:
    type: nfs
    nfs_record_root: ${cluster.fileroot}/names

scheduler:
  type: local

rollout:
  backend: "sglang:d1"
  _version: v2
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  max_concurrent_rollouts: 12
  queue_size: null
  consumer_batch_size: ${train_dataset.batch_size}
  max_head_offpolicyness: 2
  enable_rollout_tracing: false
  scheduling_spec: ${actor.scheduling_spec}
  fileroot: ${cluster.fileroot}
  tokenizer_path: ${tokenizer_path}
  dump_to_file: false
  agent:
    mode: online
    tool_call_parser: qwen
    reasoning_parser: qwen3
    export_style: individual
    turn_discount: 1.0
    set_reward_finish_timeout: 0.0
  admin_api_key: ${oc.env:AREAL_INFERENCE_ADMIN_KEY}

gconfig:
  n_samples: 1
  min_new_tokens: 0
  max_new_tokens: 4096
  greedy: false
  temperature: 1.0
  top_p: 1.0

actor:
  backend: "fsdp:d4"
  _version: v2
  admin_api_key: ${oc.env:AREAL_ACTOR_ADMIN_KEY}
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: ${oc.env:AREAL_MODEL_PATH}
  init_from_scratch: false
  disable_dropout: true
  gradient_checkpointing: true
  dtype: bfloat16
  mb_spec:
    max_tokens_per_mb: 65536
  optimizer:
    type: adam
    lr: 1.70e-5
    weight_decay: 0.017
    beta1: 0.9
    beta2: 0.999
    eps: 1e-8
    lr_scheduler_type: constant
    gradient_clipping: 1.0
    warmup_steps_proportion: 0.001
  eps_clip: 0.4
  temperature: ${gconfig.temperature}
  reward_scaling: 10.0
  reward_bias: -0.5
  kl_ctl: 0.0
  ppo_n_minibatches: 1
  recompute_logprob: true
  use_decoupled_loss: true
  rejection_sampling:
    metric: ratio
    upper: 5.0
  # Online mode currently consumes one independently rewarded trajectory per
  # group. Centering a singleton reward or flat singleton advantage would erase
  # the task-conditioned learning signal.
  reward_norm: null
  adv_norm: null
  weight_update_mode: xccl
  max_new_tokens: ${gconfig.max_new_tokens}
  scheduling_spec:
    - task_type: worker
      port_count: 2
      gpu: 1
      mem: 32
      cmd: python3 -m areal.infra.rpc.rpc_server
      env_vars:
        AREAL_ROLLOUT_TRACE_DIR: ${oc.env:AREAL_ROLLOUT_TRACE_DIR,""}

# Local CPU coordinator; elastic.enabled requires CUDA_VISIBLE_DEVICES="".
# Configure physical device indices within the current job allocation.
elastic:
  enabled: ${oc.decode:${oc.env:AREAL_ELASTIC_ENABLED,false}}
  reconfigurator: basic
  state_root: ${oc.env:AREAL_TASK_STATE_ROOT}
  actor_devices: [0, 1, 2, 3]
  rollout_devices: [4]
  checkpoint_estimated_bytes: ${oc.env:AREAL_CHECKPOINT_ESTIMATED_BYTES}
  checkpoint_keep: 2

# SGLang
sglang:
  model_path: ${actor.path}
  random_seed: ${seed}
  skip_tokenizer_init: true
  dtype: ${actor.dtype}
  max_running_requests: null
  context_length: 65536
  mem_fraction_static: 0.8

vllm:
  model: ${actor.path}
  seed: ${seed}
  skip_tokenizer_init: false
  dtype: ${actor.dtype}
  max_model_len: 65536
  gpu_memory_utilization: 0.8

# datasets
train_dataset:
  batch_size: 4
  path: "null"
  type: rl

# Utilities
saver:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: null
  freq_steps: 10
  freq_secs: null

recover:
  mode: disabled
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: null
  freq_steps: 10
  freq_secs: null

evaluator:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: null
  freq_steps: 10
  freq_secs: null

stats_logger:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  wandb:
    mode: disabled

perf_tracer:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  enabled: false
  session_tracer:
    enabled: false
