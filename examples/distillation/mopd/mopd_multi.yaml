experiment_name: qwen35_4b_mopd_2task_aime_leetcode
trial_name: trial0

seed: 1
enable_offload: false
total_train_epochs: 20
tokenizer_path: ${actor.path}

cluster:
  n_nodes: 2
  n_gpus_per_node: 16
  fileroot: /tmp/areal/experiments
  name_resolve:
    type: ray
    nfs_record_root: /tmp/areal/name_resolve


scheduler:
  type: ray

rollout:
  # backend: "vllm:t8"
  backend: "vllm:d4t2"
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  max_concurrent_rollouts: 256
  queue_size: null
  consumer_batch_size: ${train_dataset.batch_size}
  max_head_offpolicyness: 0
  enable_rollout_tracing: false
  fileroot: ${cluster.fileroot}
  tokenizer_path: ${tokenizer_path}
  dump_to_file: true
  agent:
    chat_template_kwargs:
      enable_thinking: false
  request_timeout: 10800
  scheduling_spec:
    - task_type: worker
      port_count: 2
      gpu: 1
      cpu: 1
      mem: 1
      cmd: python3 -m areal.infra.rpc.rpc_server
      env_vars:
        TASK_QUEUE_ENABLE: "1"
        PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
        HCCL_IF_BASE_PORT: "61032"
        HCCL_EXEC_TIMEOUT: "14400"
        HCCL_OP_EXPANSION_MODE: "HOST"
        ACL_DEVICE_SYNC_TIMEOUT: "14400"
        HCCL_EVENT_TIMEOUT: "14500"
        HCCL_ASYNC_ERROR_HANDLING: "0"
        ACL_STREAM_TIMEOUT: "14500000"
        HCCL_CONNECT_TIMEOUT: "7200"
        AREAL_ALLOW_DEFAULT_ADMIN_KEY: "1"


gconfig:
  n_samples: 8
  min_new_tokens: 0
  max_new_tokens: 12000
  greedy: false
  temperature: 1.0

actor:
  # backend: "megatron:(attn:d1p4t2|ffn:d1p4t1e2)"
  backend: "fsdp:d2c4"
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: Qwen/Qwen3.5-4B
  init_from_scratch: false
  disable_dropout: true
  gradient_checkpointing: false
  dtype: bfloat16
  pad_to_maximum: false
  mb_spec:
    max_tokens_per_mb: 18000
  optimizer:
    type: adam
    lr: 1e-6
    weight_decay: 0.01
    beta1: 0.9
    beta2: 0.999
    eps: 1e-8
    lr_scheduler_type: constant
    gradient_clipping: 1.0
  eps_clip: 0.2
  temperature: ${gconfig.temperature}
  reward_scaling: 1.0
  reward_bias: 0.0
  kl_ctl: 0.0
  ppo_n_minibatches: 1
  recompute_logprob: true
  use_decoupled_loss: true
  rejection_sampling:
    metric: ratio
    upper: 5.0
  reward_norm:
    mean_level: group
    std_level: group
    group_size: ${gconfig.n_samples}
  adv_norm:
    mean_level: batch
    std_level: batch
  weight_update_mode: xccl
  max_new_tokens: ${gconfig.max_new_tokens}
  scheduling_spec:
    - task_type: worker
      port_count: 2
      gpu: 1
      cpu: 4
      mem: 32
      cmd: python3 -m areal.infra.rpc.rpc_server
      env_vars:
        TASK_QUEUE_ENABLE: "1"
        PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
        HCCL_OP_EXPANSION_MODE: "HOST"
        HCCL_IF_BASE_PORT: "61032"
        HCCL_EXEC_TIMEOUT: "14400"
        ACL_DEVICE_SYNC_TIMEOUT: "14400"
        HCCL_EVENT_TIMEOUT: "14500"
        HCCL_ASYNC_ERROR_HANDLING: "0"
        ACL_STREAM_TIMEOUT: "14500000"
        HCCL_CONNECT_TIMEOUT: "7200"
        AREAL_ALLOW_DEFAULT_ADMIN_KEY: "1"

  megatron:
    bridge_type: megatron-bridge
    recompute_granularity: full
    recompute_method: "block"
    recompute_num_layers:  1
    # recompute_granularity: null
    # recompute_method: null
    # recompute_num_layers:  null
    # freeze_vision_projection: true
    # freeze_vision_model: true
    use_bridge_for_update_weights: true
    account_for_embedding_in_pipeline_split: true
    account_for_loss_in_pipeline_split: true
    ddp:
      check_for_nan_in_grad: false
  mindspeed:
    swap_optimizer: true
    use_fused_swiglu: true
    use_cp_send_recv_overlap: true
    use_fused_ring_attention_update: true
    cp_window_size: 1
    moe_alltoall_overlap_comm: false
    moe_grouped_gemm: true
    moe_zero_memory: "disable"
    moe_permute_fusion: true
    # gemm_gradient_accumulation_fusion: true
    position_embedding_type: "rope"
    sequence_parallel: true
    moe_aux_loss_coeff: 0.01
    moe_router_load_balancing_type: aux_loss
    moe_token_dispatcher_type: alltoall


teacher:
  routing_mode: domain
  rl_loss_weight: 0.0
  distill_loss_weight: 1.0
  distill_loss_type: "mopd_pg"
  teachers:
    - domain: "aime"
      path: /path/to/aime/teacher/checkpoint
      vllm:
        model: ${actor.path}
        seed: ${seed}
        skip_tokenizer_init: false
        dtype: ${actor.dtype}
        max_model_len: 16384
        gpu_memory_utilization: 0.5
        enforce_eager: true
        max_num_batched_tokens: 7000
      rollout:
          backend: "vllm:t8"
          experiment_name: ${experiment_name}
          trial_name: ${trial_name}
          max_concurrent_rollouts: 256
          queue_size: null
          consumer_batch_size: ${train_dataset.batch_size}
          max_head_offpolicyness: 1
          enable_rollout_tracing: false
          fileroot: ${cluster.fileroot}
          tokenizer_path: ${tokenizer_path}
          dump_to_file: true
          request_timeout: 10800
          scheduling_spec:
            - task_type: worker
              port_count: 2
              gpu: 1
              cpu: 1
              mem: 1
              cmd: python3 -m areal.infra.rpc.rpc_server
              env_vars:
                TASK_QUEUE_ENABLE: "2"
                PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
                HCCL_IF_BASE_PORT: "61032"
                HCCL_EXEC_TIMEOUT: "14400"
                HCCL_OP_EXPANSION_MODE: "HOST"
                ACL_DEVICE_SYNC_TIMEOUT: "14400"
                HCCL_EVENT_TIMEOUT: "14500"
                HCCL_ASYNC_ERROR_HANDLING: "0"
                ACL_STREAM_TIMEOUT: "14500000"
                AREAL_ALLOW_DEFAULT_ADMIN_KEY: "1"
                HCCL_CONNECT_TIMEOUT: "7200"
    - domain: "leetcode"
      path: /path/to/leetcode/teacher/checkpoint
      vllm:
        model: ${actor.path}
        seed: ${seed}
        skip_tokenizer_init: false
        dtype: ${actor.dtype}
        max_model_len: 16384
        gpu_memory_utilization: 0.5
        enforce_eager: true
        max_num_batched_tokens: 7000
      rollout:
          backend: "vllm:t8"
          experiment_name: ${experiment_name}
          trial_name: ${trial_name}
          max_concurrent_rollouts: 256
          queue_size: null
          consumer_batch_size: ${train_dataset.batch_size}
          max_head_offpolicyness: 1
          enable_rollout_tracing: false
          fileroot: ${cluster.fileroot}
          tokenizer_path: ${tokenizer_path}
          dump_to_file: true
          request_timeout: 10800
          scheduling_spec:
            - task_type: worker
              port_count: 2
              gpu: 1
              cpu: 1
              mem: 1
              cmd: python3 -m areal.infra.rpc.rpc_server
              env_vars:
                TASK_QUEUE_ENABLE: "2"
                PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
                HCCL_IF_BASE_PORT: "61032"
                HCCL_EXEC_TIMEOUT: "14400"
                HCCL_OP_EXPANSION_MODE: "HOST"
                ACL_DEVICE_SYNC_TIMEOUT: "14400"
                HCCL_EVENT_TIMEOUT: "14500"
                HCCL_ASYNC_ERROR_HANDLING: "0"
                ACL_STREAM_TIMEOUT: "14500000"
                AREAL_ALLOW_DEFAULT_ADMIN_KEY: "1"
                HCCL_CONNECT_TIMEOUT: "7200"

ref:
  backend: ${actor.backend}
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: ${actor.path}
  init_from_scratch: false
  disable_dropout: true
  dtype: ${actor.dtype}
  mb_spec:
    max_tokens_per_mb: 10240
  optimizer: null
  scheduling_strategy:
    type: colocation
    target: actor
  scheduling_spec: ${actor.scheduling_spec}

# SGLang
sglang:
  model_path: ${actor.path}
  random_seed: ${seed}
  skip_tokenizer_init: true
  dtype: ${actor.dtype}
  max_running_requests: null
  context_length: 32768
  mem_fraction_static: 0.8

vllm:
  model: ${actor.path}
  seed: ${seed}
  skip_tokenizer_init: false
  dtype: ${actor.dtype}
  max_model_len: 16384
  gpu_memory_utilization: 0.9
  enforce_eager: false
  # data_parallel_size: 4
  # tensor_parallel_size: 8
  enable_expert_parallel: false
  compilation_config:
    cudagraph_capture_sizes:
      - 1
      - 4
      - 8
      - 16
      - 32
      - 64
    cudagraph_mode: FULL_DECODE_ONLY

# datasets
train_dataset:
  batch_size: 128
  shuffle: true
  pin_memory: true
  num_workers: 4
  scheduling_spec: null
  upsample_to_largest: true
  datasets:
    - name: aime
      domain: aime
      path: /path/to/aime
      type: rl
      split: train
    - name: leetcode
      domain: leetcode
      path: /path/to/leetcode
      type: rl
      split: train

valid_dataset:
  batch_size: 128
  pin_memory: true
  num_workers: 4
  scheduling_spec: null
  datasets:
    - name: aime
      domain: aime
      path: /path/to/aime
      type: rl
      split: test
    - name: leetcode
      domain: leetcode
      path: /path/to/leetcode
      type: rl
      split: test

# Utilities
saver:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 10
  freq_steps: null
  freq_secs: null

recover:
  mode: disabled
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 1
  freq_steps: null
  freq_secs: 3600

evaluator:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 10
  freq_steps: null
  freq_secs: null

stats_logger:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  wandb:
    mode: disabled
perf_tracer:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  enabled: false
  session_tracer:
    enabled: false
