# Hermes via the native Agent Service and v2 online PPO.
# Model, data and run budgets are explicit environment settings.
experiment_name: hermes-dapo-ppo
trial_name: trial0
seed: 1
enable_offload: false
total_train_epochs: ${oc.env:AREAL_DAPO_EPOCHS}
tokenizer_path: ${actor.path}
cluster:
  n_nodes: 1
  n_gpus_per_node: 8
  fileroot: ${oc.env:AREAL_TASK_RUN_ROOT}
  name_resolve:
    type: nfs
    nfs_record_root: ${cluster.fileroot}/names
scheduler:
  type: local
rollout:
  backend: sglang:d4p1t1
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  max_concurrent_rollouts: 256
  queue_size: null
  consumer_batch_size: ${train_dataset.batch_size}
  max_head_offpolicyness: 2
  enable_rollout_tracing: false
  scheduling_spec: ${actor.scheduling_spec}
  fileroot: ${cluster.fileroot}
  tokenizer_path: ${tokenizer_path}
  dump_to_file: true
  agent:
    mode: online
    reasoning_parser: ''
    tool_call_parser: qwen
    export_style: individual
    turn_discount: 1.0
    drop_retry_orphans: true
  _version: v2
  admin_api_key: ${oc.env:AREAL_INFERENCE_ADMIN_KEY}
  model: ${oc.env:AREAL_MODEL_NAME}
  request_timeout: .inf
gconfig:
  n_samples: 1
  min_new_tokens: 0
  max_new_tokens: ${oc.env:AREAL_DAPO_MAX_NEW_TOKENS}
  max_tokens: ${sglang.context_length}
  greedy: false
  temperature: 1.0
actor:
  backend: megatron:d4p1t1
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: ${oc.env:AREAL_MODEL_PATH}
  init_from_scratch: false
  disable_dropout: true
  gradient_checkpointing: true
  dtype: bfloat16
  mb_spec:
    max_tokens_per_mb: 10240
  optimizer:
    type: adam
    lr: 3e-6
    weight_decay: 0.003
    beta1: 0.9
    beta2: 0.999
    eps: 1e-8
    lr_scheduler_type: constant
    gradient_clipping: 1.0
    warmup_steps_proportion: 0.001
  eps_clip: 0.4
  temperature: ${gconfig.temperature}
  reward_scaling: 10.0
  reward_bias: -0.5
  kl_ctl: 0.0
  ppo_n_minibatches: 1
  recompute_logprob: true
  use_decoupled_loss: true
  rejection_sampling:
    metric: ratio
    upper: 5.0
  adv_norm:
    mean_level: batch
    std_level: batch
  max_new_tokens: ${gconfig.max_new_tokens}
  scheduling_spec:
  - task_type: worker
    port_count: 2
    gpu: 1
    mem: 32
    cmd: python3 -m areal.infra.rpc.rpc_server
    env_vars: {}
  _version: v2
  admin_api_key: ${oc.env:AREAL_ACTOR_ADMIN_KEY}
  weight_update_mode: awex
critic: null
ref:
  backend: ${actor.backend}
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: ${actor.path}
  init_from_scratch: false
  disable_dropout: true
  dtype: ${actor.dtype}
  mb_spec:
    max_tokens_per_mb: 10240
  optimizer: null
  scheduling_strategy:
    type: colocation
    target: actor-guard
    fork: true
  scheduling_spec: ${actor.scheduling_spec}
  _version: v2
  admin_api_key: ${oc.env:AREAL_ACTOR_ADMIN_KEY}
sglang:
  model_path: ${actor.path}
  random_seed: ${seed}
  skip_tokenizer_init: true
  dtype: ${actor.dtype}
  max_running_requests: null
  context_length: ${oc.env:AREAL_DAPO_CONTEXT_LENGTH}
  mem_fraction_static: 0.8
  enable_memory_saver: true
vllm:
  model: ${actor.path}
  seed: ${seed}
  skip_tokenizer_init: false
  dtype: ${actor.dtype}
  max_model_len: 32768
  gpu_memory_utilization: 0.9
train_dataset:
  batch_size: 256
  shuffle: true
  pin_memory: true
  num_workers: 4
  path: ${oc.env:AREAL_DAPO_TRAIN_TASKS}
  type: rl
  max_length: null
valid_dataset: null
saver:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 1
  freq_steps: null
  freq_secs: null
recover:
  mode: disabled
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 1
  freq_steps: null
  freq_secs: null
evaluator:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: null
  freq_steps: null
  freq_secs: null
stats_logger:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  wandb:
    mode: disabled
perf_tracer:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  enabled: false
  session_tracer:
    enabled: false
total_train_steps: ${oc.env:AREAL_DAPO_TOTAL_STEPS}
