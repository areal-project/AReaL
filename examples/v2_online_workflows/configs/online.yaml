# SPDX-License-Identifier: Apache-2.0
# Six-GPU online PPO example: Actor TP2 plus four SGLang TP1 replicas.
experiment_name: v2-online-workflows
trial_name: trial0

seed: 1
enable_offload: false
total_train_epochs: 1
total_train_steps: 3
tokenizer_path: ${actor.path}

cluster:
  n_nodes: 1
  n_gpus_per_node: 6
  fileroot: ${oc.env:AREAL_TASK_RUN_ROOT}
  name_resolve:
    type: nfs
    nfs_record_root: ${cluster.fileroot}/names

scheduler:
  type: local

rollout:
  backend: "sglang:d4t1"
  model: task-model
  _version: v2
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  max_concurrent_rollouts: 32
  queue_size: null
  consumer_batch_size: ${train_dataset.batch_size}
  max_head_offpolicyness: 2
  enable_rollout_tracing: false
  scheduling_spec: ${actor.scheduling_spec}
  fileroot: ${cluster.fileroot}
  tokenizer_path: ${tokenizer_path}
  workers_ready_timeout: 300
  setup_timeout: 600
  request_timeout: 1800
  dump_to_file: true
  agent:
    mode: online
    tool_call_parser: qwen
    reasoning_parser: ""
    engine_max_tokens: 262138
    export_style: individual
    turn_discount: 1.0
    set_reward_finish_timeout: 0.0
  admin_api_key: ${oc.env:AREAL_INFERENCE_ADMIN_KEY}

gconfig:
  n_samples: 1
  min_new_tokens: 0
  max_new_tokens: 8192
  greedy: false
  temperature: 1.0
  top_p: 1.0

actor:
  backend: "megatron:d1t2"
  _version: v2
  admin_api_key: ${oc.env:AREAL_ACTOR_ADMIN_KEY}
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: ${oc.env:AREAL_MODEL_PATH}
  workers_ready_timeout: 300
  setup_timeout: 900
  init_from_scratch: false
  disable_dropout: true
  gradient_checkpointing: true
  dtype: bfloat16
  megatron:
    bridge_type: mbridge
    enable_chunked_logits: true
    entropy_requires_grad: false
    lm_head_loss_chunk_size: 1024
  mb_spec:
    max_tokens_per_mb: 262144
  optimizer:
    type: adam
    lr: 1.0e-6
    weight_decay: 0.017
    beta1: 0.9
    beta2: 0.999
    eps: 1e-8
    lr_scheduler_type: constant
    gradient_clipping: 1.0
    warmup_steps_proportion: 0.0
  eps_clip: 0.4
  temperature: ${gconfig.temperature}
  reward_scaling: 10.0
  reward_bias: -0.5
  kl_ctl: 0.0
  ppo_n_minibatches: 1
  recompute_logprob: true
  use_decoupled_loss: true
  rejection_sampling:
    metric: ratio
    upper: 5.0
  # Online mode currently consumes one independently rewarded trajectory per
  # group. Centering a singleton reward or flat singleton advantage would erase
  # the task-conditioned learning signal.
  reward_norm: null
  adv_norm: null
  weight_update_mode: awex
  max_new_tokens: ${gconfig.max_new_tokens}
  scheduling_spec:
    - task_type: worker
      port_count: 2
      gpu: 1
      mem: 32
      cmd: python3 -m areal.infra.rpc.rpc_server
      env_vars:
        PYTHONPATH: ${oc.env:PYTHONPATH}
        OMP_NUM_THREADS: "4"
        NCCL_CUMEM_ENABLE: "0"
        NCCL_NVLS_ENABLE: "0"
        AWEX_DELTA_TRANSFER: "0"
        AWEX_SEPARATION_WEIGHT_UPDATE: "0"
        AWEX_WU_USE_GROUP: "1"
        AREAL_ROLLOUT_TRACE_DIR: ${oc.env:AREAL_ROLLOUT_TRACE_DIR,""}

# Local CPU coordinator; elastic.enabled requires CUDA_VISIBLE_DEVICES="".
# Configure physical device indices within the current job allocation.
elastic:
  enabled: ${oc.decode:${oc.env:AREAL_ELASTIC_ENABLED,false}}
  reconfigurator: basic
  state_root: ${oc.env:AREAL_TASK_STATE_ROOT}
  actor_devices: [0, 1]
  rollout_devices: [2, 3, 4, 5]
  checkpoint_estimated_bytes: ${oc.env:AREAL_CHECKPOINT_ESTIMATED_BYTES}
  checkpoint_keep: 1

# SGLang
sglang:
  model_path: ${actor.path}
  random_seed: ${seed}
  skip_tokenizer_init: true
  dtype: ${actor.dtype}
  max_running_requests: 8
  chunked_prefill_size: 8192
  context_length: 262144
  mem_fraction_static: 0.8

# datasets
train_dataset:
  batch_size: 32
  path: "null"
  type: rl

# Utilities
saver:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: null
  freq_steps: 1
  freq_secs: null

recover:
  mode: disabled
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: null
  freq_steps: 1
  freq_secs: null

evaluator:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: null
  freq_steps: 1
  freq_secs: null

stats_logger:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  wandb:
    mode: disabled
  tensorboard:
    path: ${cluster.fileroot}/tensorboard

perf_tracer:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  enabled: false
  session_tracer:
    enabled: false
