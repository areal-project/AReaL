# Four 8-GPU Ray nodes. Actor DP4 x PP2 x TP4, rollout DP32 x TP1.
# Rollout workers fork beside their corresponding actor workers for v1 AWEX.
experiment_name: areal-v2.2.0-ci-gsm8k
trial_name: ${oc.env:QWEN_ARENA_TRIAL}
seed: 1
enable_offload: false
total_train_epochs: 10
tokenizer_path: ${actor.path}
cluster:
  n_nodes: 4
  n_gpus_per_node: 8
  fileroot: ${oc.env:QWEN_ARENA_OUTPUT}
  name_resolve:
    type: nfs
    nfs_record_root: ${cluster.fileroot}/name_resolve/${experiment_name}/${trial_name}
scheduler:
  type: ray
rollout:
  backend: sglang:d32t1p1
  setup_timeout: 3600.0
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  max_concurrent_rollouts: 256
  queue_size: null
  consumer_batch_size: ${train_dataset.batch_size}
  max_head_offpolicyness: 2
  enable_rollout_tracing: false
  scheduling_spec:
  - task_type: worker
    port_count: 2
    gpu: 1
    cpu: 4
    mem: 64
    cmd: python3 -m areal.infra.rpc.rpc_server
    env_vars:
      TMS_INIT_ENABLE: '0'
      TMS_INIT_ENABLE_CPU_BACKUP: '0'
      TOKENIZERS_PARALLELISM: 'false'
      NCCL_DEBUG: INFO
      CUDA_DEVICE_MAX_CONNECTIONS: '1'
      NVIDIA_TF32_OVERRIDE: '0'
      OMP_NUM_THREADS: '4'
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: ${oc.env:QWEN_REPO}
      QWEN_ARENA_TRIAL: ${trial_name}
      QWEN_PLE_CHUNK_TOKENS: '0'
      QWEN_GDN_CP_COMPAT: '0'
      AREAL_ALLOW_DEFAULT_ADMIN_KEY: '1'
      NO_PROXY: '*'
      no_proxy: '*'
      SGLANG_NUMA_BIND_V2: '0'
      AWEX_ACTOR_ALLOC_CONF: expandable_segments:False
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:False
  fileroot: ${cluster.fileroot}
  tokenizer_path: ${tokenizer_path}
  dump_to_file: true
  agent:
    mode: inline
    export_style: individual
    turn_discount: 1.0
    reasoning_parser: qwen3
  scheduling_strategy:
    type: colocation
    target: actor
    fork: true
  _version: v1
gconfig:
  n_samples: 4
  min_new_tokens: 0
  max_new_tokens: 1024
  max_tokens: 2048
  greedy: false
  temperature: 1.0
actor:
  backend: megatron:d4p2t4c1e1
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: ${oc.env:QWEN_MODEL}
  init_from_scratch: false
  disable_dropout: true
  gradient_checkpointing: true
  dtype: bfloat16
  mb_spec:
    max_tokens_per_mb: 262144
    n_mbs_divisor: 2
  optimizer:
    type: adam
    lr: 3e-6
    weight_decay: 0.003
    beta1: 0.9
    beta2: 0.999
    eps: 1e-8
    lr_scheduler_type: constant
    gradient_clipping: 1.0
    warmup_steps_proportion: 0.001
  eps_clip: 0.4
  temperature: ${gconfig.temperature}
  reward_scaling: 10.0
  reward_bias: -0.5
  kl_ctl: 0.0
  ppo_n_minibatches: 1
  recompute_logprob: true
  use_decoupled_loss: true
  rejection_sampling:
    metric: ratio
    upper: 5.0
  reward_norm:
    mean_level: group
    std_level: group
    group_size: ${gconfig.n_samples}
  adv_norm:
    mean_level: null
    std_level: null
  max_new_tokens: ${gconfig.max_new_tokens}
  scheduling_spec:
  - task_type: worker
    port_count: 2
    gpu: 1
    cpu: 4
    mem: 64
    cmd: python3 -m areal.infra.rpc.rpc_server
    env_vars:
      TMS_INIT_ENABLE: '0'
      TMS_INIT_ENABLE_CPU_BACKUP: '0'
      TOKENIZERS_PARALLELISM: 'false'
      NCCL_DEBUG: INFO
      CUDA_DEVICE_MAX_CONNECTIONS: '1'
      NVIDIA_TF32_OVERRIDE: '0'
      OMP_NUM_THREADS: '4'
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: ${oc.env:QWEN_REPO}
      QWEN_ARENA_TRIAL: ${trial_name}
      QWEN_PLE_CHUNK_TOKENS: '0'
      QWEN_GDN_CP_COMPAT: '0'
      AREAL_ALLOW_DEFAULT_ADMIN_KEY: '1'
      NO_PROXY: '*'
      no_proxy: '*'
      NVTE_FLASH_ATTN_V4: '0'
      AWEX_ACTOR_ALLOC_CONF: expandable_segments:True
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True,garbage_collection_threshold:0.7
  weight_update_mode: awex
  megatron:
    bridge_type: megatron-bridge
    language_model_only: false
    enable_mtp: false
    enable_fp32_lm_head: false
    cross_entropy_loss_fusion: false
    fp8_config: null
    ddp:
      overlap_grad_reduce: false
      overlap_param_gather: false
      fp8_param_gather: false
    freeze_vision_model: true
    freeze_vision_projection: true
    use_bridge_for_update_weights: true
  _version: v1
  scheduling_strategy:
    type: separation
ref: null
sglang:
  model_path: ${actor.path}
  random_seed: ${seed}
  skip_tokenizer_init: true
  dtype: ${actor.dtype}
  max_running_requests: null
  context_length: 32768
  mem_fraction_static: 0.8
  enable_memory_saver: true
  disable_prefill_cuda_graph: true
  mamba_ssm_dtype: bfloat16
  cuda_graph_max_bs: 48
  attention_backend: trtllm_mha
vllm:
  model: ${actor.path}
  seed: ${seed}
  skip_tokenizer_init: false
  dtype: ${actor.dtype}
  max_model_len: 32768
  gpu_memory_utilization: 0.9
train_dataset:
  batch_size: 256
  shuffle: true
  pin_memory: true
  num_workers: 4
  path: ${oc.env:QWEN_DATASET}
  type: rl
  max_length: 1024
valid_dataset:
  batch_size: 256
  pin_memory: true
  num_workers: 4
  path: ${oc.env:QWEN_DATASET}
  type: rl
saver:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: null
  freq_steps: 10
  freq_secs: null
recover:
  mode: disabled
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 1
  freq_steps: null
  freq_secs: 3600
evaluator:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 1
  freq_steps: null
  freq_secs: null
stats_logger:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  wandb:
    mode: disabled
    project: ${oc.env:WANDB_PROJECT,${experiment_name}}
    name: ${trial_name}
perf_tracer:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  enabled: false
  session_tracer:
    enabled: false
total_train_steps: 120
allocation_mode: ''
