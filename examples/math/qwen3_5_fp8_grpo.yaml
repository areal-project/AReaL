# One-GPU Qwen3.5-0.8B smoke recipe; requires a Hopper/Blackwell CUDA environment.
# MODEL_PATH is BF16; prepare FP8_MODEL_PATH with areal.tools.prepare_qwen35_fp8.
defaults:
  - gsm8k_grpo_awex_colocate
  - _self_

experiment_name: qwen3-5-fp8-grpo
trial_name: ${oc.env:TRIAL_NAME,smoke}
total_train_steps: 2

cluster:
  n_gpus_per_node: 1
  fileroot: ${oc.env:FILEROOT}
  name_resolve:
    nfs_record_root: ${cluster.fileroot}/name_resolve

actor:
  backend: "megatron:d1p1t1"
  path: ${oc.env:MODEL_PATH}
  weight_update_mode: awex
  optimizer:
    lr: 1.0e-6
  megatron:
    bridge_type: megatron-bridge
    enable_mtp: false
    fp8_config:
      mode: e4m3
      recipe: blockwise
      param: false
      direct_convert: false
    ddp:
      fp8_param_gather: false
  scheduling_spec:
    - task_type: worker
      port_count: 2
      gpu: 1
      mem: 32
      cmd: python3 -m areal.infra.rpc.rpc_server
      env_vars:
        NVTE_FP8_BLOCK_SCALING_FP32_SCALES: "1"
        TMS_INIT_ENABLE: "0"
        TMS_INIT_ENABLE_CPU_BACKUP: "0"

ref:
  megatron:
    bridge_type: megatron-bridge

rollout:
  backend: "sglang:d1t1p1"
  max_head_offpolicyness: 1
  max_concurrent_rollouts: 4
  scheduling_strategy:
    type: colocation
    target: actor
    fork: true

sglang:
  model_path: ${oc.env:FP8_MODEL_PATH}
  fp8_gemm_runner_backend: triton
  context_length: 2048
  max_running_requests: 4
  mem_fraction_static: 0.5
  enable_multimodal: true
  disable_cuda_graph: true
  mamba_ssm_dtype: bfloat16

gconfig:
  max_new_tokens: 128
  max_tokens: 2048

train_dataset:
  batch_size: 2

evaluator:
  freq_epochs: null

saver:
  freq_epochs: null
