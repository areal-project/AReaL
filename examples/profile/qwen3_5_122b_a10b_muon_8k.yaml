# Full-model feasibility smoke, not a convergence or RL throughput benchmark.
defaults:
  - qwen3_5_35b_a3b_sft_profile
  - _self_

experiment_name: qwen3-5-122b-a10b-muon-8k
trial_name: staged-tp2-ep8
total_train_steps: 3

cluster:
  fileroot: ${oc.env:AREAL_EXPERIMENT_ROOT}
  name_resolve:
    nfs_record_root: ${cluster.fileroot}/name_resolve/${experiment_name}/${trial_name}

actor:
  path: ${oc.env:QWEN3_5_122B_A10B_MODEL_PATH}
  mb_spec:
    n_mbs: 1
    max_tokens_per_mb: 8192
    n_mbs_divisor: 1
  optimizer:
    type: dist_muon
    lr: 1.0e-6
    warmup_steps: 0
    muon:
      momentum: 0.95
      num_ns_steps: 5
      tp_mode: duplicated
  megatron:
    use_precision_aware_optimizer: false
    main_grads_dtype: float32
    cpu_staged_offload:
      enabled: true
      buffer_count: 1
      bucket_size_mb: 128
    ddp:
      grad_reduce_in_fp32: true
      overlap_grad_reduce: false
      overlap_param_gather: false
      use_distributed_optimizer: false
    async_save: false
    enable_mtp: false
    enable_mtp_training: false
    lm_head_loss_chunk_size: 1024
    recompute_granularity: selective
    recompute_method: null
    recompute_num_layers: null
    recompute_modules: [core_attn, moe_act, layernorm, shared_experts, mlp, gdn_norm_out]

profile:
  fake_seq_len: 8192
  fake_dataset_size: 12

train_dataset:
  batch_size: 4
  path: fake://profile/qwen3-5-122b-a10b-8k
  max_length: 8192

stats_logger:
  wandb:
    mode: online

memory_profiler:
  profile_steps: []
