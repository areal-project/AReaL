kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
kubeadmConfigPatches:
  - |
    kind: KubeletConfiguration
    # This development cluster shares a large, mostly occupied Docker disk.
    # Keep an absolute free-space floor rather than reserving 10% of that disk.
    evictionHard:
      memory.available: "1Gi"
      nodefs.available: "10Gi"
      nodefs.inodesFree: "5%"
      imagefs.available: "10Gi"
      imagefs.inodesFree: "5%"
