# Inline SWE: fixed 4-card Actor plus two TP2 inference replicas.
experiment_name: elastic-demo
trial_name: demo
seed: 1
enable_offload: false
total_train_epochs: 1
total_train_steps: 4
tokenizer_path: ${actor.path}
cluster:
  n_nodes: 1
  n_gpus_per_node: 8
  fileroot: ${oc.env:AREAL_DEMO_ROOT}/logs
  name_resolve:
    type: nfs
    nfs_record_root: ${cluster.fileroot}/names
scheduler:
  type: local
rollout:
  backend: sglang:d2t2
  _version: v2
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  max_concurrent_rollouts: 2
  queue_size: null
  consumer_batch_size: ${train_dataset.batch_size}
  max_head_offpolicyness: 0
  enable_rollout_tracing: false
  scheduling_spec: ${actor.scheduling_spec}
  fileroot: ${cluster.fileroot}
  tokenizer_path: ${tokenizer_path}
  dump_to_file: false
  agent:
    mode: inline
    tool_call_parser: qwen25
    reasoning_parser: qwen3
    export_style: concat
    drop_retry_orphans: true
    chat_template_type: concat
    turn_discount: 1.0
    set_reward_finish_timeout: 0.0
    engine_max_tokens: 16384
  admin_api_key: ${oc.env:AREAL_INFERENCE_ADMIN_KEY}
gconfig:
  n_samples: 4
  reward_normalization: false
  min_new_tokens: 0
  max_new_tokens: 4096
  greedy: false
  temperature: 1.0
  top_p: 1.0
actor:
  backend: megatron:d1t4
  _version: v2
  admin_api_key: ${oc.env:AREAL_ACTOR_ADMIN_KEY}
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: ${oc.env:AREAL_MODEL_PATH}
  init_from_scratch: false
  disable_dropout: true
  gradient_checkpointing: true
  dtype: bfloat16
  mb_spec:
    n_mbs: 1
    max_tokens_per_mb: 16384
  optimizer:
    type: adam
    lr: 3.0e-06
    weight_decay: 0.017
    beta1: 0.9
    beta2: 0.999
    eps: 1e-8
    lr_scheduler_type: constant
    gradient_clipping: 1.0
    warmup_steps_proportion: 0.0
  eps_clip: 0.2
  eps_clip_higher: 0.28
  temperature: ${gconfig.temperature}
  reward_scaling: 1.0
  reward_bias: 0.0
  reward_clip: 5.0
  discount: 1.0
  gae_lambda: 1.0
  kl_ctl: 0.0
  ppo_n_minibatches: 1
  recompute_logprob: true
  use_decoupled_loss: true
  rejection_sampling:
    metric: ratio
    upper: 5.0
  reward_norm:
    mean_level: group
    std_level: group
    group_size: ${gconfig.n_samples}
    eps: 1e-5
  adv_norm: null
  weight_update_mode: awex
  max_new_tokens: ${gconfig.max_new_tokens}
  scheduling_spec:
  - task_type: worker
    port_count: 2
    gpu: 1
    mem: 32
    cmd: python3 -m areal.infra.rpc.rpc_server
    env_vars:
      DTE_DELTA_TRANSFER: '0'
      DTE_SEPARATION_WEIGHT_UPDATE: '0'
      AWEX_DELTA_TRANSFER: '0'
      AWEX_SEPARATION_WEIGHT_UPDATE: '0'
      AWEX_WU_USE_GROUP: '1'
      NCCL_CUMEM_ENABLE: '0'
      NCCL_NVLS_ENABLE: '0'
      OMP_NUM_THREADS: '4'
  grad_reduce_dtype: bfloat16
  megatron:
    bridge_type: mbridge
    use_precision_aware_optimizer: true
    main_grads_dtype: bfloat16
    main_params_dtype: float32
    exp_avg_dtype: float32
    exp_avg_sq_dtype: float32
    enable_chunked_logits: true
    entropy_requires_grad: false
    ddp:
      grad_reduce_in_fp32: false
      overlap_grad_reduce: true
      use_distributed_optimizer: true
actor_lifecycle:
  # This path alone enables parallel child cleanup and BF16 Megatron full-restore
  # bootstrap without repeated HF weights. First startup still loads HF normally.
  mode: on_demand
  policy: ${oc.env:AREAL_DEMO_POLICY,agent}
  state_root: ${oc.env:AREAL_DEMO_ROOT}/state
  actor_devices:
  - 0
  - 1
  - 2
  - 3
  rollout_devices:
  - 4
  - 5
  - 6
  - 7
  idle_timeout: 40.0
  min_ready_seconds: 0.0
  poll_interval: 0.5
  checkpoint_estimated_bytes: 68719476736
  checkpoint_keep: 1
  checkpoint_free_space_floor: 2147483648
  max_recovery_attempts: 0
sglang:
  model_path: ${actor.path}
  random_seed: ${seed}
  skip_tokenizer_init: true
  dtype: ${actor.dtype}
  max_running_requests: 8
  context_length: 16384
  mem_fraction_static: 0.65
  disable_radix_cache: true
vllm:
  model: ${actor.path}
  seed: ${seed}
  skip_tokenizer_init: false
  dtype: ${actor.dtype}
  max_model_len: 16384
  gpu_memory_utilization: 0.8
train_dataset:
  batch_size: 2
  path: ${oc.env:AREAL_DATASET_PATH}
  type: rl
  shuffle: false
  num_workers: 0
  pin_memory: false
saver:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: null
  freq_steps: null
  freq_secs: null
recover:
  mode: disabled
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: null
  freq_steps: null
  freq_secs: null
evaluator:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: null
  freq_steps: null
  freq_secs: null
stats_logger:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  wandb:
    mode: disabled
perf_tracer:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  enabled: false
  session_tracer:
    enabled: false
