experiment_name: arena-grpo
trial_name: ${oc.env:TRIAL_NAME,smoke}
seed: 1
enable_offload: false
total_train_epochs: 1
tokenizer_path: ${actor.path}
cluster:
  n_nodes: 2
  n_gpus_per_node: 8
  fileroot: ${oc.env:AREAL_FILEROOT}
  name_resolve:
    type: nfs
    nfs_record_root: ${cluster.fileroot}/name_resolve
scheduler:
  type: slurm
rollout:
  backend: sglang:d4p1t2
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  max_concurrent_rollouts: 4
  queue_size: null
  consumer_batch_size: ${train_dataset.batch_size}
  max_head_offpolicyness: 0
  enable_rollout_tracing: true
  scheduling_spec: ${actor.scheduling_spec}
  fileroot: ${cluster.fileroot}
  tokenizer_path: ${tokenizer_path}
  dump_to_file: true
  agent:
    mode: inline
    export_style: concat
    turn_discount: 1.0
    admin_api_key: ${oc.env:SWE_RL_ADMIN_API_KEY}
    tool_call_parser: qwen25
    reasoning_parser: qwen3
    chat_template_type: concat
    engine_max_tokens: ${gconfig.max_tokens}
    session_timeout_seconds: 3600
  setup_timeout: 900
  request_timeout: 7200
gconfig:
  n_samples: 2
  min_new_tokens: 0
  max_new_tokens: 8192
  max_tokens: 32767
  greedy: false
  temperature: 1.0
actor:
  backend: fsdp:d8p1t1
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: ${oc.env:MODEL_PATH}
  init_from_scratch: false
  disable_dropout: true
  gradient_checkpointing: true
  dtype: bfloat16
  mb_spec:
    max_tokens_per_mb: 32768
    packing_algorithm: ffd
  optimizer:
    type: adam
    lr: 6.0e-06
    weight_decay: 0.017
    beta1: 0.9
    beta2: 0.999
    eps: 1e-8
    lr_scheduler_type: constant
    gradient_clipping: 1.0
    warmup_steps_proportion: 0.001
  eps_clip: 0.4
  temperature: ${gconfig.temperature}
  reward_scaling: 1.0
  reward_bias: 0.0
  kl_ctl: 0.0
  ppo_n_minibatches: 1
  recompute_logprob: true
  use_decoupled_loss: true
  rejection_sampling:
    metric: ratio
    upper: 5.0
  reward_norm:
    mean_level: group
    std_level: group
    group_size: ${gconfig.n_samples}
  adv_norm:
    mean_level: batch
    std_level: batch
  weight_update_mode: xccl
  max_new_tokens: ${gconfig.max_new_tokens}
  scheduling_spec:
  - task_type: worker
    gpu: 1
    cpu: 8
    mem: 32
    port_count: 8
    image: ${oc.env:AREAL_IMAGE}
    cmd: ${oc.env:AREAL_PYTHON} -m areal.infra.rpc.rpc_server
    env_vars:
      PYTHONPATH: ${oc.env:AREAL_DIR}
    additional_bash_cmds:
    - set -a; source "$ARENA_CREDENTIALS_FILE"; set +a
    - unset ALL_PROXY all_proxy HTTP_PROXY HTTPS_PROXY http_proxy https_proxy
ref:
  backend: ${actor.backend}
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: ${actor.path}
  init_from_scratch: false
  disable_dropout: true
  dtype: ${actor.dtype}
  mb_spec:
    max_tokens_per_mb: 10240
    packing_algorithm: ffd
  optimizer: null
  scheduling_strategy:
    type: colocation
    target: actor
  scheduling_spec: ${actor.scheduling_spec}
sglang:
  model_path: ${actor.path}
  random_seed: ${seed}
  skip_tokenizer_init: true
  dtype: ${actor.dtype}
  max_running_requests: null
  # SGLang reserves one token when checking prompt + completion length.
  context_length: 32768
  mem_fraction_static: 0.7
vllm:
  model: ${actor.path}
  seed: ${seed}
  skip_tokenizer_init: false
  dtype: ${actor.dtype}
  max_model_len: 32768
  gpu_memory_utilization: 0.8
train_dataset:
  batch_size: 8
  shuffle: false
  pin_memory: true
  num_workers: 0
  path: arena
  type: rl
  max_length: 1024
valid_dataset:
  batch_size: 8
  pin_memory: true
  num_workers: 0
  path: arena
  type: rl
  shuffle: false
saver:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: null
  freq_steps: null
  freq_secs: null
recover:
  mode: disabled
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: null
  freq_steps: null
  freq_secs: null
evaluator:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: null
  freq_steps: null
  freq_secs: null
stats_logger:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  wandb:
    mode: disabled
perf_tracer:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  enabled: false
  session_tracer:
    enabled: false
total_train_steps: 1
dynamic_bs: false
should_accept_fn: null
econfig:
  dataset_source: arena
  stream_id: ${oc.env:ARENA_STREAM_ID,""}
  arena_base_url: ${oc.env:ARENA_OPENAPI_BASE}
  arena_llm_route_mode: session_gateway
  arena_result_dump_dir: ${cluster.fileroot}/${experiment_name}/${trial_name}/arena_results
  timeout: 1800.0
