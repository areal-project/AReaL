# Run with examples/vlm/geometry3k_agent_grpo.py.
experiment_name: ascend-nightly-geometry3k-grpo
trial_name: trial0

seed: 1
enable_offload: true
total_train_epochs: 2
tokenizer_path: ${actor.path}

cluster:
  n_nodes: 1
  n_gpus_per_node: 16
  fileroot: /tmp/areal/experiments
  name_resolve:
    type: nfs
    nfs_record_root: /tmp/areal/name_resolve

scheduler:
  type: ray

rollout:
  backend: "vllm:d2p1t8"
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  setup_timeout: 1800
  max_concurrent_rollouts: 256
  queue_size: null
  consumer_batch_size: ${train_dataset.batch_size}
  max_head_offpolicyness: 0
  enable_rollout_tracing: false
  scheduling_strategy:
    type: colocation
    target: actor
  scheduling_spec:
    - task_type: worker
      port_count: 2
      cpu: 8
      gpu: 1
      mem: 32
      cmd: python3 -m areal.infra.rpc.rpc_server
      env_vars:
        AWEX_USE_BATCH_SEND_RECV: "1"
        HCCL_BUFFSIZE: "400"
        VLLM_SERVER_DEV_MODE: "1"
        TASK_QUEUE_ENABLE: "1"
        HCCL_EXEC_TIMEOUT: "14400"
        ACL_DEVICE_SYNC_TIMEOUT: "14400"
        HCCL_EVENT_TIMEOUT: "14500"
        HCCL_ASYNC_ERROR_HANDLING: "0"
        ACL_STREAM_TIMEOUT: "14500000"
        HCCL_CONNECT_TIMEOUT: "7200"
        PYTORCH_NPU_ALLOC_CONF: "expandable_segments:False"
  fileroot: ${cluster.fileroot}
  tokenizer_path: ${tokenizer_path}
  dump_to_file: false
  agent:
    admin_api_key: ${oc.env:AREAL_NIGHTLY_ADMIN_KEY}
    mode: inline
    export_style: concat
    turn_discount: 1.0
    chat_template_type: concat
    tool_call_parser: qwen3_coder
    reasoning_parser: qwen3

gconfig:
  n_samples: 4
  min_new_tokens: 0
  max_new_tokens: 2048
  greedy: false
  temperature: 1.0

eval_gconfig: ${gconfig}

actor:
  admin_api_key: ${oc.env:AREAL_NIGHTLY_ADMIN_KEY}
  backend: "megatron:(attn:d2p2t2c2|ffn:d1p2t2e4)"
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: Qwen/Qwen3.5-35B-A3B
  init_from_scratch: false
  disable_dropout: true
  gradient_checkpointing: true
  dtype: bfloat16
  mb_spec:
    max_tokens_per_mb: 32768
  optimizer:
    type: adam
    lr: 5e-7
    weight_decay: 0.01
    beta1: 0.9
    beta2: 0.999
    eps: 1e-8
    lr_scheduler_type: constant
    gradient_clipping: 1.0
    warmup_steps_proportion: 0.001
  mindspeed:
    sequence_parallel: true
    moe_alltoall_overlap_comm: true
    moe_grouped_gemm: true
    moe_zero_memory: disable
    moe_permute_fusion: true
    gemm_gradient_accumulation_fusion: false
    swap_optimizer: true
    use_fused_swiglu: true
    position_embedding_type: "rope"
  eps_clip: 0.2
  temperature: ${gconfig.temperature}
  reward_scaling: 1.0
  reward_bias: 0.0
  kl_ctl: 0.0
  ppo_n_minibatches: 1
  recompute_logprob: true
  use_decoupled_loss: true
  rejection_sampling:
    level: token
    action: clamp
    metric: ratio
    upper: 2.0
  reward_norm:
    mean_level: group
    std_level: group
    group_size: ${gconfig.n_samples}
  adv_norm: null
  weight_update_mode: awex
  megatron:
    bridge_type: megatron-bridge
    use_bridge_for_update_weights: true
  max_new_tokens: ${gconfig.max_new_tokens}
  scheduling_spec:
    - task_type: worker
      port_count: 2
      cpu: 8
      gpu: 1
      mem: 20
      cmd: python3 -m areal.infra.rpc.rpc_server
      env_vars:
        AWEX_USE_BATCH_SEND_RECV: "1"
        HCCL_BUFFSIZE: "400"
        TASK_QUEUE_ENABLE: "2"
        HCCL_EXEC_TIMEOUT: "14400"
        ACL_DEVICE_SYNC_TIMEOUT: "14400"
        HCCL_EVENT_TIMEOUT: "14500"
        HCCL_ASYNC_ERROR_HANDLING: "0"
        ACL_STREAM_TIMEOUT: "14500000"
        HCCL_CONNECT_TIMEOUT: "7200"
        PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
        TORCH_COMPILE_DISABLE: "1"

awex:
  enable_colocate_mode: true
  weights_comm_nccl_group_size: 1
  weights_validation_steps: 0
  device_backend: npu
  use_mindspeed: true
  meta_server_addr: auto
  comm_backend: hccl
  weights_exchange_ipc_backend: npu

vllm:
  model: ${actor.path}
  seed: ${seed}
  skip_tokenizer_init: false
  dtype: ${actor.dtype}
  max_model_len: 32768
  max_num_seqs: 64
  max_num_batched_tokens: 2048
  data_parallel_size: 4
  tensor_parallel_size: 2
  enable_expert_parallel: true
  enable_sleep_mode: true
  gpu_memory_utilization: 0.65
  disable_sliding_window: false
  enforce_eager: false
  no_enable_chunked_prefill: false
  no_enable_prefix_caching: false
  compilation_config:
    cudagraph_capture_sizes: [1, 2, 4, 8, 16, 24, 32, 40, 48, 56, 64]
    cudagraph_mode: FULL_DECODE_ONLY
  additional_config:
    enable_cpu_binding: true
    weight_nz_mode: 0
  speculative_config:
    method: mtp
    num_speculative_tokens: 2

# datasets
train_dataset:
  batch_size: 32
  shuffle: true
  pin_memory: true
  num_workers: 4
  path: hiyouga/geometry3k
  type: rl

valid_dataset:
  batch_size: 32
  pin_memory: true
  num_workers: 4
  path: hiyouga/geometry3k
  type: rl

# Utilities
saver:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: ${total_train_epochs}
  freq_steps: null
  freq_secs: null

recover:
  mode: disabled
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 1
  freq_steps: null
  freq_secs: 3600

evaluator:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 1
  freq_steps: null
  freq_secs: null

stats_logger:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  wandb:
    mode: disabled

perf_tracer:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  enabled: false
  session_tracer:
    enabled: false
