experiment_name: ascend-geometry3k-e2e
trial_name: trial0

seed: 1
enable_offload: false
total_train_epochs: 1
total_train_steps: 2
tokenizer_path: ${actor.path}

cluster:
  n_nodes: 1
  n_gpus_per_node: 8
  fileroot: /tmp/areal/experiments
  name_resolve:
    type: nfs
    nfs_record_root: /tmp/areal/name_resolve

scheduler:
  type: local

rollout:
  backend: "vllm:d1p2t2"
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  setup_timeout: 1800
  max_concurrent_rollouts: 4
  queue_size: null
  consumer_batch_size: ${train_dataset.batch_size}
  max_head_offpolicyness: 0
  enable_rollout_tracing: false
  scheduling_spec:
    - task_type: worker
      port_count: 2
      gpu: 1
      mem: 32
      cmd: python3 -m areal.infra.rpc.rpc_server
      env_vars:
        TASK_QUEUE_ENABLE: "1"
        HCCL_EXEC_TIMEOUT: "14400"
        ACL_DEVICE_SYNC_TIMEOUT: "14400"
        HCCL_EVENT_TIMEOUT: "14500"
        HCCL_ASYNC_ERROR_HANDLING: "0"
        ACL_STREAM_TIMEOUT: "14500000"
        HCCL_CONNECT_TIMEOUT: "7200"
        PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
  fileroot: ${cluster.fileroot}
  tokenizer_path: ${tokenizer_path}
  dump_to_file: false
  agent:
    mode: inline
    export_style: concat
    turn_discount: 1.0
    chat_template_type: concat
    tool_call_parser: qwen3_coder
    reasoning_parser: qwen3

gconfig:
  n_samples: 4
  min_new_tokens: 16
  max_new_tokens: 32
  greedy: false
  temperature: 1.0

eval_gconfig:
  n_samples: 1
  min_new_tokens: 16
  max_new_tokens: 32
  greedy: true

actor:
  backend: "megatron:d1p2t2"
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: Qwen/Qwen3.5-0.8B
  init_from_scratch: false
  disable_dropout: true
  gradient_checkpointing: true
  dtype: bfloat16
  mb_spec:
    max_tokens_per_mb: 8192
  optimizer:
    type: adam
    lr: 5e-7
    weight_decay: 0.01
    beta1: 0.9
    beta2: 0.999
    eps: 1e-8
    lr_scheduler_type: constant
    gradient_clipping: 1.0
    warmup_steps_proportion: 0.001
  mindspeed:
    swap_optimizer: true
    use_fused_swiglu: true
    position_embedding_type: "rope"
  eps_clip: 0.2
  temperature: ${gconfig.temperature}
  reward_scaling: 1.0
  reward_bias: 0.0
  kl_ctl: 0.0
  ppo_n_minibatches: 1
  recompute_logprob: true
  use_decoupled_loss: true
  rejection_sampling:
    level: token
    action: clamp
    metric: ratio
    upper: 2.0
  reward_norm:
    mean_level: group
    std_level: group
    group_size: ${gconfig.n_samples}
  adv_norm: null
  weight_update_mode: awex
  megatron:
    bridge_type: megatron-bridge
    use_bridge_for_update_weights: true
  max_new_tokens: ${gconfig.max_new_tokens}
  scheduling_spec:
    - task_type: worker
      port_count: 2
      gpu: 1
      mem: 32
      cmd: python3 -m areal.infra.rpc.rpc_server
      env_vars:
        TASK_QUEUE_ENABLE: "2"
        HCCL_EXEC_TIMEOUT: "14400"
        ACL_DEVICE_SYNC_TIMEOUT: "14400"
        HCCL_EVENT_TIMEOUT: "14500"
        HCCL_ASYNC_ERROR_HANDLING: "0"
        ACL_STREAM_TIMEOUT: "14500000"
        HCCL_CONNECT_TIMEOUT: "7200"
        PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
        TORCH_COMPILE_DISABLE: "1"

ref:
  backend: ${actor.backend}
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: ${actor.path}
  init_from_scratch: false
  disable_dropout: true
  dtype: ${actor.dtype}
  mb_spec:
    max_tokens_per_mb: 8192
  optimizer: null
  scheduling_strategy:
    type: colocation
    target: actor
  scheduling_spec: ${actor.scheduling_spec}

awex:
  device_backend: npu
  use_mindspeed: true
  meta_server_addr: auto
  comm_backend: hccl
  weights_exchange_ipc_backend: npu

vllm:
  model: ${actor.path}
  seed: ${seed}
  skip_tokenizer_init: false
  dtype: ${actor.dtype}
  max_model_len: 32768
  max_num_seqs: 4
  gpu_memory_utilization: 0.9
  disable_sliding_window: false
  enforce_eager: false
  no_enable_chunked_prefill: false
  no_enable_prefix_caching: false
  compilation_config:
    cudagraph_capture_sizes:
      - 4
      - 8
      - 16
    cudagraph_mode: FULL_DECODE_ONLY
  additional_config:
    enable_cpu_binding: true
  speculative_config:
    method: mtp
    num_speculative_tokens: 3

# datasets
train_dataset:
  scheduling_spec: null
  batch_size: 1
  shuffle: true
  pin_memory: true
  num_workers: 0
  path: hiyouga/geometry3k
  type: rl

valid_dataset:
  scheduling_spec: null
  batch_size: 1
  pin_memory: true
  num_workers: 0
  path: hiyouga/geometry3k
  type: rl

# Utilities
saver:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: null
  freq_steps: 2
  freq_secs: null

recover:
  mode: disabled
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 1
  freq_steps: null
  freq_secs: 3600

evaluator:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: null
  freq_steps: 2
  freq_secs: null

stats_logger:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  wandb:
    mode: disabled

perf_tracer:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  enabled: false
  session_tracer:
    enabled: false
