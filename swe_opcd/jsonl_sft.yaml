experiment_name: whj-swe-opcd
trial_name: trial0

seed: 1
enable_offload: false
total_train_epochs: 1
tokenizer_path: ${actor.path}

cluster:
  n_nodes: 1
  n_gpus_per_node: 8
  fileroot: /tmp/areal/experiments
  name_resolve:
    type: nfs
    nfs_record_root: /tmp/areal/name_resolve


scheduler:
  type: null

actor:
  backend: "fsdp:d8p1t1"
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: Qwen/Qwen3-1.7B
  init_from_scratch: false
  gradient_checkpointing: true
  dtype: bfloat16
  mb_spec:
    max_tokens_per_mb: 32768
  optimizer:
    type: adam
    lr: 2e-5
    weight_decay: 0.0
    beta1: 0.9
    beta2: 0.999
    eps: 1e-8
    lr_scheduler_type: cosine
    gradient_clipping: 1.0
  scheduling_spec:
    - task_type: worker
      port_count: 2
      gpu: 1
      mem: 32
      cmd: python3 -m areal.infra.rpc.rpc_server
      env_vars: {}

train_dataset:
  batch_size: 128
  shuffle: true
  pin_memory: true
  num_workers: 4
  path: openai/gsm8k
  type: sft

valid_dataset:
  batch_size: 128
  pin_memory: true
  num_workers: 4
  path: openai/gsm8k
  type: sft

# Utilities
saver:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 1
  freq_steps: null
  freq_secs: null

recover:
  mode: auto
  retries: 10
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 1
  freq_steps: null
  freq_secs: 3600

evaluator:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 1
  freq_steps: null
  freq_secs: null

stats_logger:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  wandb:
    mode: disabled

launcher:
  trainer_env_vars: 
    PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True,NCCL_TIMEOUT=1800,NCCL_SOCKET_IFNAME=bond0,NCCL_IB_DISABLE=0,NCCL_NET=IB,NCCL_NET_PLUGIN=,NCCL_IB_GID_INDEX=3,NCCL_IB_TIMEOUT=22,NCCL_IB_RETRY_CNT=7,NCCL_IB_SL=5,NCCL_IB_TC=136,NCCL_IB_HCA=mlx5_bond,NCCL_IB_QPS_PER_CONNECTION=8,NCCL_SET_THREAD_NAME=1,NCCL_DEBUG=WARN
  inference_server_env_vars:
    NCCL_SOCKET_IFNAME=bond0,NCCL_IB_DISABLE=0,NCCL_NET=IB,NCCL_NET_PLUGIN=,NCCL_IB_GID_INDEX=3,NCCL_IB_TIMEOUT=22,NCCL_IB_RETRY_CNT=7,NCCL_IB_SL=5,NCCL_IB_TC=136,NCCL_IB_HCA=mlx5_bond,NCCL_IB_QPS_PER_CONNECTION=8,NCCL_SET_THREAD_NAME=1,NCCL_DEBUG=WARN
  slurm:
    mount: /storage:/storage
    trainer_image: /storage/openpsi/images/areal-latest.sif
    inference_server_image: /storage/openpsi/images/areal-latest.sif
